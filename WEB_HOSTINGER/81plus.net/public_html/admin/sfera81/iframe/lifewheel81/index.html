<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFEWHEEL81+ — Ruota della Vita</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #070D1A;
    color: #E8EDF5;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: #00D9FF;
    text-transform: uppercase;
    margin-bottom: 4px;
    text-shadow: 0 0 12px rgba(0,217,255,0.5);
  }
  .subtitle {
    font-size: 0.72rem;
    color: #8090A8;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  #wheelCanvas {
    cursor: pointer;
    filter: drop-shadow(0 0 18px rgba(0,217,255,0.15));
  }
  #panel {
    display: none;
    background: linear-gradient(135deg, rgba(10,20,40,0.97) 0%, rgba(5,12,25,0.97) 100%);
    border: 1px solid rgba(0,217,255,0.3);
    border-radius: 14px;
    padding: 18px 20px;
    margin-top: 14px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 0 24px rgba(0,217,255,0.1);
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  #panel h2 {
    font-size: 1rem;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #panel .area-code {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: #8090A8;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .score-bar-wrap {
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    height: 12px;
    margin: 10px 0;
    overflow: hidden;
  }
  .score-bar {
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
  }
  .score-label {
    font-size: 0.78rem;
    color: #8090A8;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  #panel .cap-info {
    font-size: 0.7rem;
    color: #5A6A80;
    margin-top: 6px;
  }
  #panel .life-area-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    color: #B0BEC5;
    margin-top: 8px;
  }
  #panel .life-area-row span.dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #panel .weakest-tag {
    display: inline-block;
    background: rgba(255,80,80,0.15);
    border: 1px solid rgba(255,80,80,0.4);
    color: #FF8080;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 8px;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }
  #panel .na-tag {
    display: inline-block;
    background: rgba(90,90,90,0.2);
    border: 1px solid rgba(90,90,90,0.4);
    color: #6A7A8A;
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .legend {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 14px;
    margin-top: 14px;
    max-width: 420px;
    width: 100%;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.67rem;
    color: #8090A8;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .legend-item:hover { background: rgba(255,255,255,0.04); }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #statusBadge {
    font-size: 0.68rem;
    background: rgba(0,217,255,0.1);
    border: 1px solid rgba(0,217,255,0.3);
    color: #00D9FF;
    padding: 2px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<h1>LIFEWHEEL81+</h1>
<div class="subtitle">La tua Ruota della Vita Operativa</div>
<div id="statusBadge">MEMBER — cap 6/10</div>

<canvas id="wheelCanvas" width="420" height="420"></canvas>

<div id="panel">
  <h2 id="panelTitle"></h2>
  <div class="area-code" id="panelCode"></div>
  <div class="score-label">
    <span>Punteggio attuale</span>
    <span id="panelScoreVal"></span>
  </div>
  <div class="score-bar-wrap">
    <div class="score-bar" id="panelBar"></div>
  </div>
  <div class="cap-info" id="panelCap"></div>
  <div class="life-area-row">
    <span class="dot" id="panelDot"></span>
    <span id="panelLifeArea"></span>
  </div>
  <div id="panelTags"></div>
</div>

<div class="legend" id="legend"></div>

<script>
const AREAS = [
  { id:1, code:'SICUREZZA_LAVORO', name:'sicurezza lavoro',   life:'Salute e Benessere',   color:'#00E676', score:0, applicable:true },
  { id:2, code:'CRM_CRESCITA',     name:'CRM e crescita',     life:'Carriera e Lavoro',     color:'#00D9FF', score:0, applicable:true },
  { id:3, code:'WALLET_PV',        name:'wallet e PV+',       life:'Finanze e Denaro',      color:'#FFD24A', score:0, applicable:true },
  { id:4, code:'FORMAZIONE',       name:'formazione',          life:'Crescita Personale',   color:'#9B6BFF', score:0, applicable:true },
  { id:5, code:'DOCUMENTI',        name:'documenti',           life:'Ambiente e Spazio',    color:'#FF6B35', score:0, applicable:true },
  { id:6, code:'NETWORK_RELAZIONI',name:'network e relazioni', life:'Relazioni e Rete',     color:'#FF4081', score:0, applicable:true },
  { id:7, code:'IDENTITA_PROFILO', name:'identità e profilo', life:'Famiglia e Community',  color:'#69F0AE', score:0, applicable:true },
  { id:8, code:'VISIONE_CONTINUITA',name:'visione e continuità',life:'Svago e Visione',     color:'#40C4FF', score:0, applicable:true },
];

const STATUS_CAPS = { MEMBER:6, NETWORKERS:7, ELITE:8, FRANCHISER:9, CLUB:10 };

let userStatus = 'MEMBER';
let statusCap = 6;
let weakestIdx = -1;
let selectedIdx = -1;
let pulse = 0;
let raf;

function parseParams() {
  const p = new URLSearchParams(window.location.search);
  userStatus = (p.get('status') || 'MEMBER').toUpperCase();
  statusCap = STATUS_CAPS[userStatus] || 6;
  document.getElementById('statusBadge').textContent = `${userStatus} — cap ${statusCap}/10`;

  // scores: comma-separated list of 8 integers matching area sort_order
  const sc = p.get('scores');
  if (sc) {
    const vals = sc.split(',').map(v => Math.min(parseInt(v)||0, statusCap));
    AREAS.forEach((a,i) => { if(vals[i] !== undefined) a.score = vals[i]; });
  }
  // applicability: comma-separated 0/1 for each area
  const ap = p.get('applicable');
  if (ap) {
    const vals = ap.split(',');
    AREAS.forEach((a,i) => { a.applicable = vals[i] !== '0'; });
  }
}

function findWeakest() {
  let minS = Infinity, minI = -1;
  AREAS.forEach((a,i) => {
    if (a.applicable && a.score < minS) { minS = a.score; minI = i; }
  });
  weakestIdx = minI;
}

const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const CX = canvas.width / 2;
const CY = canvas.height / 2;
const R_MAX = 170;
const R_MIN = 20;
const N = AREAS.length;
const SLICE = (Math.PI * 2) / N;

function areaAngle(i) { return -Math.PI/2 + i * SLICE; }

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawWheel(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background rings
  for (let ring = 2; ring <= 10; ring += 2) {
    const r = R_MIN + (R_MAX - R_MIN) * ring / 10;
    ctx.beginPath();
    ctx.arc(CX, CY, r, 0, Math.PI*2);
    ctx.strokeStyle = ring === statusCap ? 'rgba(0,217,255,0.25)' : 'rgba(255,255,255,0.04)';
    ctx.lineWidth = ring === statusCap ? 1.5 : 0.7;
    ctx.stroke();
    if (ring % 2 === 0) {
      ctx.fillStyle = 'rgba(130,160,200,0.18)';
      ctx.font = '9px monospace';
      ctx.fillText(ring, CX + r + 3, CY + 3);
    }
  }

  // Spoke lines
  for (let i = 0; i < N; i++) {
    const ang = areaAngle(i);
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(ang) * R_MIN, CY + Math.sin(ang) * R_MIN);
    ctx.lineTo(CX + Math.cos(ang) * R_MAX, CY + Math.sin(ang) * R_MAX);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  // Filled slices
  AREAS.forEach((a, i) => {
    const ang0 = areaAngle(i) - SLICE/2 + 0.03;
    const ang1 = areaAngle(i) + SLICE/2 - 0.03;
    const r = R_MIN + (R_MAX - R_MIN) * (a.applicable ? a.score : 0) / 10;
    const isSelected = selectedIdx === i;
    const isWeakest = weakestIdx === i && a.applicable;
    const isNA = !a.applicable;

    if (r > R_MIN + 2) {
      const grad = ctx.createRadialGradient(CX, CY, R_MIN, CX, CY, r);
      const alpha = isNA ? 0.1 : (isSelected ? 0.85 : 0.55);
      grad.addColorStop(0, hexToRgba(a.color, 0.05));
      grad.addColorStop(1, hexToRgba(a.color, alpha));

      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, r, ang0, ang1);
      ctx.closePath();
      ctx.fillStyle = isNA ? 'rgba(80,80,80,0.12)' : grad;
      ctx.fill();

      // Stroke border
      ctx.strokeStyle = isSelected ? a.color : hexToRgba(a.color, 0.35);
      ctx.lineWidth = isSelected ? 1.8 : 0.8;
      ctx.stroke();
    }

    // Glow on weakest applicable area
    if (isWeakest && !isSelected) {
      const glowAlpha = 0.3 + 0.2 * Math.sin(t * 0.04);
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R_MIN + (R_MAX - R_MIN) * (a.score + 1.5) / 10, ang0, ang1);
      ctx.closePath();
      ctx.strokeStyle = `rgba(255,80,80,${glowAlpha})`;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  });

  // Labels
  AREAS.forEach((a, i) => {
    const ang = areaAngle(i);
    const lx = CX + Math.cos(ang) * (R_MAX + 14);
    const ly = CY + Math.sin(ang) * (R_MAX + 14);

    ctx.font = selectedIdx === i ? 'bold 9.5px Segoe UI' : '8.5px Segoe UI';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = !a.applicable ? 'rgba(100,120,140,0.5)' : (selectedIdx === i ? a.color : 'rgba(200,215,230,0.75)');

    const words = a.name.split(' ');
    if (words.length > 2) {
      ctx.fillText(words.slice(0,2).join(' '), lx, ly - 6);
      ctx.fillText(words.slice(2).join(' '), lx, ly + 6);
    } else {
      ctx.fillText(a.name, lx, ly);
    }

    // Score badge
    const br = R_MIN + (R_MAX - R_MIN) * (a.applicable ? a.score : 0) / 10;
    const badgeR = Math.max(br - 14, R_MIN + 8);
    const bx = CX + Math.cos(ang) * badgeR;
    const by = CY + Math.sin(ang) * badgeR;
    if (a.applicable && a.score > 0) {
      ctx.beginPath();
      ctx.arc(bx, by, 9, 0, Math.PI*2);
      ctx.fillStyle = hexToRgba(a.color, 0.9);
      ctx.fill();
      ctx.fillStyle = '#070D1A';
      ctx.font = 'bold 8px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(a.score, bx, by);
    }
  });

  // Center hub
  const hubGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, R_MIN);
  hubGrad.addColorStop(0, 'rgba(0,217,255,0.3)');
  hubGrad.addColorStop(1, 'rgba(0,217,255,0.02)');
  ctx.beginPath();
  ctx.arc(CX, CY, R_MIN, 0, Math.PI*2);
  ctx.fillStyle = hubGrad;
  ctx.fill();
  ctx.fillStyle = '#E8EDF5';
  ctx.font = 'bold 8.5px Segoe UI';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('81+', CX, CY);
}

function animate(t) {
  drawWheel(t);
  raf = requestAnimationFrame(animate);
}

function getClickedArea(mx, my) {
  const dx = mx - CX, dy = my - CY;
  const dist = Math.hypot(dx, dy);
  if (dist < R_MIN || dist > R_MAX + 16) return -1;
  let ang = Math.atan2(dy, dx);
  // normalize to 0..2PI starting from -PI/2
  let rel = ang + Math.PI/2;
  if (rel < 0) rel += Math.PI*2;
  const idx = Math.floor(rel / SLICE + 0.5) % N;
  return idx;
}

canvas.addEventListener('click', function(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;
  const idx = getClickedArea(mx, my);
  if (idx < 0) { selectedIdx = -1; document.getElementById('panel').style.display='none'; return; }
  selectedIdx = idx;
  openPanel(idx);
});

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const t = e.touches[0];
  const mx = (t.clientX - rect.left) * scaleX;
  const my = (t.clientY - rect.top) * scaleY;
  const idx = getClickedArea(mx, my);
  if (idx < 0) { selectedIdx = -1; document.getElementById('panel').style.display='none'; return; }
  selectedIdx = idx;
  openPanel(idx);
}, { passive: false });

function openPanel(idx) {
  const a = AREAS[idx];
  const panel = document.getElementById('panel');
  document.getElementById('panelTitle').innerHTML = `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${a.color};flex-shrink:0"></span> ${a.name.toUpperCase()}`;
  document.getElementById('panelCode').textContent = a.code;
  document.getElementById('panelLifeArea').textContent = a.life;
  document.getElementById('panelDot').style.background = a.color;

  const score = a.applicable ? a.score : 0;
  const pct = (score / 10) * 100;
  document.getElementById('panelScoreVal').textContent = `${score} / 10`;
  const bar = document.getElementById('panelBar');
  bar.style.width = pct + '%';
  bar.style.background = a.applicable ? `linear-gradient(90deg, ${a.color}88, ${a.color})` : 'rgba(100,100,100,0.4)';

  document.getElementById('panelCap').textContent = `Cap attuale: ${statusCap}/10 (status ${userStatus})`;

  const tagsDiv = document.getElementById('panelTags');
  tagsDiv.innerHTML = '';
  if (!a.applicable) {
    tagsDiv.innerHTML = '<span class="na-tag">N/A per il tuo profilo</span>';
  } else if (idx === weakestIdx) {
    tagsDiv.innerHTML = '<span class="weakest-tag">⚠ Area più debole — priorità alta</span>';
  }

  panel.style.display = 'block';
  panel.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function buildLegend() {
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  AREAS.forEach((a, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<div class="legend-dot" style="background:${a.applicable?a.color:'#444'}"></div><span>${a.name}</span>`;
    item.addEventListener('click', () => { selectedIdx = i; openPanel(i); });
    leg.appendChild(item);
  });
}

parseParams();
findWeakest();
buildLegend();
animate(0);
</script>
</body>
</html>
