# SOCIAL GROWTH81+ — Generazione contenuti Telegram con AI reale (24 azioni/ora)
# Gira ogni mattina alle 03:30 UTC (prima del workflow socialgrowth81-daily generico).
# Usa il motore a cascata OpenAI -> Anthropic -> Gemini -> Groq (il primo disponibile)
# per generare contenuto REALE per ognuna delle 11 chat, secondo il ciclo di 30 giorni
# e il fill-rate calibrato per chat (Club/VIP restano a bassa frequenza per scelta).
# NON pubblica nulla: scrive solo le code in stato BOZZA. La pubblicazione resta un
# passo MANUALE separato (PUBLISH = HUMAN_APPROVAL, regola FASE ZERO81+).
name: socialgrowth81-telegram-daily

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/create-claude-md-docs-JWjKP

      - name: Genera contenuto Telegram del giorno (24 azioni/ora, ciclo 30 giorni)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 "81PLUS_GLOBAL_MASTER/81plus.net/0-81PLUS.NET/MARKETING81+/SOCIAL_GROWTH81+/scripts/generate_telegram_content.py"

      - name: Commit e push delle code generate
        run: |
          git config user.name "socialgrowth81-bot"
          git config user.email "bot@81plus.net"
          git add "81PLUS_GLOBAL_MASTER/81plus.net/0-81PLUS.NET/MARKETING81+/SOCIAL_GROWTH81+/04_SCHEDULED/"
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "SOCIAL GROWTH81+ Telegram: contenuti giorno $(date -u +%F) generati da AI (BOZZA, in attesa approvazione)"
            git push origin claude/create-claude-md-docs-JWjKP
          fi
