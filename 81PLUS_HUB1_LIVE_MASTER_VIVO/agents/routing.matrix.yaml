# ─── PRIORITY OVERRIDES ──────────────────────────────────────────────────────

priority_overrides:
  # Queste keyword triggherano SEMPRE SemanticGuard81 PRIMA di qualsiasi agente
  semantic_guard_always:
    - "rendimento"
    - "interesse"
    - "investimento"
    - "guadagno garantito"
    - "profitto garantito"
    - "ritorno"
    - "capitale"
    - "dividendi"
    - "staking"
    - "apy"
    - "apr"
    - "yield"

  # Queste richieste richiedono conferma esplicita prima dell'azione
  always_require_confirm:
    - "elimina"
    - "cancella"
    - "reset"
    - "drop"
    - "pubblica in produzione"
    - "invia a tutti"
    - "bonifico"
    - "paga"
    - "fattura"
    - "modifica provvigioni"
    - "modifica paygate"
    - "deploy"


