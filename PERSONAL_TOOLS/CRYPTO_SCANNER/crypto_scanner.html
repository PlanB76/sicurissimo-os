<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Crypto Scanner — Mirco</title>
<style>
:root {
  --bg: #05050A; --card: #0F0F18; --card2: #16161F;
  --orange: #E8501A; --gold: #FFD24A; --green: #3FBF6B;
  --cyan: #00D9FF; --red: #FF4444; --text: #E8E8F0;
  --muted: #6B6B80; --border: #1E1E2E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'DM Sans','Segoe UI',sans-serif;font-size:14px;min-height:100vh;padding-bottom:20px}
a{color:var(--cyan);text-decoration:none}
button{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-weight:700;font-size:13px;padding:10px 18px;transition:opacity .15s}
button:hover{opacity:.8}
button:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--orange);color:#fff}
.btn-ghost{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:7px 12px;font-size:12px}
select,input[type="text"]{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit}
select:focus,input:focus{outline:none;border-color:var(--cyan)}

/* HEADER */
header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;background:var(--bg)}
.logo{font-family:'Impact',sans-serif;font-size:19px;letter-spacing:2px;color:var(--orange)}
.logo span{color:var(--gold)}
.hdr-right{display:flex;align-items:center;gap:10px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sdot.loading{background:var(--gold);animation:blink 1s infinite}
.sdot.error{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:45px;z-index:90}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}

/* PAGES */
.page{display:none;padding:16px}
.page.active{display:block}

/* DISCLAIMER */
.disc{background:#1A1208;border:1px solid #4A3000;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:11px;color:#C8A040;line-height:1.5}

/* STATS BAR */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--card);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.stat-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.stat-v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}

/* GEM GRID */
.gem-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:600px){.gem-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.gem-grid{grid-template-columns:1fr 1fr 1fr}}

.gem-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:16px;position:relative;overflow:hidden}
.gem-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.gem-forte::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.gem-buona::before{background:linear-gradient(90deg,var(--gold),var(--orange))}
.gem-watch::before{background:var(--border)}

.gem-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gem-coin{display:flex;align-items:center;gap:10px}
.gem-img{width:32px;height:32px;border-radius:50%}
.gem-sym{font-weight:700;font-size:16px}
.gem-name{font-size:11px;color:var(--muted);margin-top:1px}
.badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700}
.badge-forte{background:rgba(63,191,107,.15);color:var(--green)}
.badge-buona{background:rgba(255,210,74,.15);color:var(--gold)}
.badge-watch{background:rgba(107,107,128,.15);color:var(--muted)}

.score-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.score-num{font-size:32px;font-weight:700;min-width:54px;font-variant-numeric:tabular-nums}
.bar-wrap{flex:1}
.bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s}
.bar-fill.forte{background:linear-gradient(90deg,var(--green),var(--cyan))}
.bar-fill.buona{background:linear-gradient(90deg,var(--gold),var(--orange))}
.bar-fill.watch{background:var(--muted)}
.bar-lbl{font-size:10px;color:var(--muted);margin-top:3px}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.metric{background:var(--card2);border-radius:6px;padding:8px;text-align:center}
.metric-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.metric-v{font-size:14px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.up{color:var(--green)}
.down{color:var(--red)}

.reason{font-size:11px;color:var(--muted);line-height:1.5;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}
.reason strong{color:var(--text)}

/* SCANNER TABLE */
.table-wrap{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:560px}
th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #0D0D18;white-space:nowrap;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.ci{display:flex;align-items:center;gap:8px}
.cimg{width:22px;height:22px;border-radius:50%}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;z-index:9999;opacity:0;transition:all .3s;max-width:320px;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">CRYPTO <span>SCANNER</span></div>
  </div>
  <div class="hdr-right">
    <div class="sdot" id="sdot"></div>
    <span id="last-time" style="font-size:11px;color:var(--muted)"></span>
    <button class="btn-ghost btn-sm" onclick="loadData()">⟳ Aggiorna</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-gems" onclick="switchTab('gems')">💎 GEMME DEL GIORNO</div>
  <div class="tab" id="tab-scanner" onclick="switchTab('scanner')">📊 SCANNER COMPLETO</div>
</div>

<!-- GEMME PAGE -->
<div class="page active" id="page-gems">
  <div class="disc"><strong>Solo uso personale.</strong> Non è consulenza finanziaria. Le crypto sono ad alto rischio. Puoi perdere tutto il capitale.</div>

  <div class="stats">
    <div class="stat"><div class="stat-l">Gemme Forti</div><div class="stat-v" id="s-forte" style="color:var(--green)">—</div></div>
    <div class="stat"><div class="stat-l">Gemme Buone</div><div class="stat-v" id="s-buona" style="color:var(--gold)">—</div></div>
    <div class="stat"><div class="stat-l">Score Medio</div><div class="stat-v" id="s-avg">—</div></div>
    <div class="stat"><div class="stat-l">Fear &amp; Greed</div><div class="stat-v" id="s-fg">—</div></div>
  </div>

  <div class="filters">
    <select id="gems-filter" onchange="renderGems()">
      <option value="top">Migliori (Forte+Buona)</option>
      <option value="forte">Solo FORTE</option>
      <option value="buona">Solo BUONA</option>
      <option value="all">Tutte</option>
    </select>
    <select id="gems-sort" onchange="renderGems()">
      <option value="gem_score">Score Gemma</option>
      <option value="p24h">24h %</option>
      <option value="volume_spike">Volume Spike</option>
      <option value="momentum">Momentum</option>
    </select>
  </div>

  <div class="gem-grid" id="gems-grid">
    <div style="grid-column:1/-1"><div class="loading"><div class="spinner"></div>Scansione mercato in corso...</div></div>
  </div>
</div>

<!-- SCANNER PAGE -->
<div class="page" id="page-scanner">
  <div class="filters">
    <select id="scan-sort" onchange="renderTable()">
      <option value="gem_score">GEM Score</option>
      <option value="volume_spike">Volume Spike</option>
      <option value="momentum">Momentum</option>
      <option value="p24h_abs">24h % (assoluto)</option>
      <option value="risk_asc">Rischio ↑</option>
    </select>
    <select id="scan-risk" onchange="renderTable()">
      <option value="10">Tutti i rischi</option>
      <option value="4">Basso (≤4)</option>
      <option value="6">Medio (≤6)</option>
    </select>
    <input type="text" id="scan-search" placeholder="Cerca..." oninput="renderTable()" style="width:120px">
  </div>
  <div id="table-wrap">
    <div class="loading"><div class="spinner"></div>Caricamento...</div>
  </div>
</div>

<div id="toast"></div>

<script>
let allCoins = [];

function switchTab(id) {
  ['gems','scanner'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t === id);
    document.getElementById('page-'+t).classList.toggle('active', t === id);
  });
}

function setStatus(s) {
  const d = document.getElementById('sdot');
  d.className = 'sdot' + (s==='loading'?' loading':s==='error'?' error':'');
}

async function loadData() {
  setStatus('loading');
  try {
    const [mktRes, fgRes] = await Promise.allSettled([
      fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=volume_desc&per_page=100&page=1&sparkline=false&price_change_percentage=1h,24h,7d'),
      fetch('https://api.alternative.me/fng/')
    ]);

    if (mktRes.status !== 'fulfilled' || !mktRes.value.ok) throw new Error('API limit');
    allCoins = (await mktRes.value.json()).map(enrichCoin);

    if (fgRes.status === 'fulfilled' && fgRes.value.ok) {
      const fg = await fgRes.value.json();
      const v = fg.data?.[0];
      if (v) {
        const el = document.getElementById('s-fg');
        el.textContent = v.value + ' · ' + (v.value_classification||'');
        el.style.color = v.value > 65 ? 'var(--red)' : v.value < 35 ? 'var(--green)' : 'var(--gold)';
      }
    }

    document.getElementById('last-time').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    setStatus('ok');
    updateStats();
    renderGems();
    renderTable();
  } catch(e) {
    setStatus('error');
    document.getElementById('gems-grid').innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--red)">Errore API CoinGecko. Riprova tra 30 secondi.<br><br><small style="color:var(--muted)">${e.message}</small></div>`;
    document.getElementById('table-wrap').innerHTML = `<div style="text-align:center;padding:40px;color:var(--red)">Errore API</div>`;
  }
}

function enrichCoin(c) {
  const p1h  = c.price_change_percentage_1h_in_currency  || 0;
  const p24h = c.price_change_percentage_24h             || 0;
  const p7d  = c.price_change_percentage_7d_in_currency  || 0;
  const volume_spike = c.market_cap > 0 ? c.total_volume / c.market_cap : 0;
  const momentum = p1h * 0.5 + p24h * 0.35 + p7d * 0.15;
  const cat = c.market_cap > 10e9 ? 'large' : c.market_cap > 1e9 ? 'mid' : 'small';

  // Risk 1-10
  let r = 0;
  if      (c.market_cap > 100e9) r += 0;
  else if (c.market_cap > 10e9)  r += 1;
  else if (c.market_cap > 1e9)   r += 2;
  else if (c.market_cap > 100e6) r += 3;
  else                           r += 4;
  const v24abs = Math.abs(p24h);
  if      (v24abs < 2)  r += 0;
  else if (v24abs < 5)  r += 1;
  else if (v24abs < 10) r += 2;
  else if (v24abs < 20) r += 3;
  else                  r += 4;
  if (volume_spike > 0.5) r -= 1;
  const risk_score = Math.max(1, Math.min(10, Math.round(r + 1)));

  // GEM score 0-100
  let sc = 0;
  // Momentum (0-35)
  if      (momentum > 15) sc += 35;
  else if (momentum > 10) sc += 28;
  else if (momentum > 5)  sc += 20;
  else if (momentum > 2)  sc += 12;
  else if (momentum > 0)  sc += 6;
  // Volume spike (0-25)
  if      (volume_spike > 1.0)  sc += 25;
  else if (volume_spike > 0.5)  sc += 20;
  else if (volume_spike > 0.3)  sc += 14;
  else if (volume_spike > 0.15) sc += 8;
  else if (volume_spike > 0.08) sc += 4;
  // Trend consistency (0-20)
  const pos = (p1h>0?1:0)+(p24h>0?1:0)+(p7d>0?1:0);
  if (pos === 3) sc += 20;
  else if (pos === 2) sc += 10;
  // Market cap tier (0-8): mid-large sweet spot
  if (c.market_cap > 1e9 && c.market_cap < 100e9) sc += 8;
  else sc += 3;
  // Fresh acceleration (0-10)
  if (p1h > 2 && p24h > 5)  sc += 10;
  else if (p1h > 1)          sc += 5;
  // Risk penalty
  if (risk_score >= 8) sc -= 12;
  else if (risk_score >= 6) sc -= 5;

  const gem_score = Math.max(0, Math.min(100, Math.round(sc)));
  const gem_level = gem_score >= 68 ? 'forte' : gem_score >= 48 ? 'buona' : 'watch';

  // Reason text
  const parts = [];
  if (momentum > 10)     parts.push('<strong>Momentum molto forte</strong> su tutti i timeframe');
  else if (momentum > 3) parts.push('<strong>Momentum positivo</strong>');
  if (pos === 3)         parts.push('Trend consistente 1h/24h/7d');
  if (volume_spike > 0.3) parts.push(`<strong>Volume spike</strong> ${(volume_spike*100).toFixed(0)}% del market cap`);
  if (p1h > 2)           parts.push(`Accelerazione +${p1h.toFixed(1)}% ultima ora`);
  if (risk_score <= 3)   parts.push('Rischio contenuto');
  if (risk_score >= 7)   parts.push('<span style="color:var(--red)">Attenzione: alta volatilità</span>');
  const gem_reason = parts.join('. ') || 'Attività nella media. Nessun segnale forte al momento.';

  return { ...c, p1h, p24h, p7d, p24h_abs: v24abs, volume_spike, momentum, risk_score, cat, gem_score, gem_level, gem_reason };
}

function updateStats() {
  document.getElementById('s-forte').textContent = allCoins.filter(c => c.gem_level === 'forte').length;
  document.getElementById('s-buona').textContent = allCoins.filter(c => c.gem_level === 'buona').length;
  const avg = allCoins.length ? Math.round(allCoins.reduce((a,c) => a+c.gem_score,0)/allCoins.length) : 0;
  document.getElementById('s-avg').textContent = avg;
}

function renderGems() {
  if (!allCoins.length) return;
  const filter = document.getElementById('gems-filter').value;
  const sort   = document.getElementById('gems-sort').value;

  let coins = allCoins.filter(c => {
    if (filter === 'forte') return c.gem_level === 'forte';
    if (filter === 'buona') return c.gem_level === 'buona';
    if (filter === 'top')   return c.gem_level !== 'watch';
    return true;
  });
  coins.sort((a,b) => sort === 'risk_asc' ? a.risk_score - b.risk_score : (b[sort]||0) - (a[sort]||0));

  if (!coins.length) {
    document.getElementById('gems-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">Nessuna gemma con questi filtri</div>';
    return;
  }

  document.getElementById('gems-grid').innerHTML = coins.map(c => {
    const lvl = c.gem_level;
    const sc  = c.gem_score;
    const col = lvl==='forte'?'var(--green)':lvl==='buona'?'var(--gold)':'var(--muted)';
    const badgeTxt = lvl==='forte'?'🔥 FORTE':lvl==='buona'?'⭐ BUONA':'👁 WATCH';
    return `<div class="gem-card gem-${lvl}">
      <div class="gem-hdr">
        <div class="gem-coin">
          <img class="gem-img" src="${c.image}" onerror="this.style.display='none'" loading="lazy">
          <div>
            <div class="gem-sym">${c.symbol.toUpperCase()}</div>
            <div class="gem-name">${c.name}</div>
          </div>
        </div>
        <span class="badge badge-${lvl}">${badgeTxt}</span>
      </div>
      <div class="score-row">
        <div class="score-num" style="color:${col}">${sc}</div>
        <div class="bar-wrap">
          <div class="bar"><div class="bar-fill ${lvl}" style="width:${sc}%"></div></div>
          <div class="bar-lbl">GEM SCORE · Rischio ${c.risk_score}/10 · $${fmtPrice(c.current_price)}</div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><div class="metric-l">1h</div><div class="metric-v ${c.p1h>=0?'up':'down'}">${fmt(c.p1h)}%</div></div>
        <div class="metric"><div class="metric-l">24h</div><div class="metric-v ${c.p24h>=0?'up':'down'}">${fmt(c.p24h)}%</div></div>
        <div class="metric"><div class="metric-l">7d</div><div class="metric-v ${c.p7d>=0?'up':'down'}">${fmt(c.p7d)}%</div></div>
        <div class="metric"><div class="metric-l">Vol/Cap</div><div class="metric-v" style="color:var(--cyan)">${(c.volume_spike*100).toFixed(0)}%</div></div>
        <div class="metric"><div class="metric-l">Momentum</div><div class="metric-v ${c.momentum>=0?'up':'down'}">${fmt(c.momentum)}</div></div>
        <div class="metric"><div class="metric-l">Cap</div><div class="metric-v" style="font-size:11px;color:var(--muted)">${c.cat.toUpperCase()}</div></div>
      </div>
      <div class="reason">${c.gem_reason}</div>
    </div>`;
  }).join('');
}

function renderTable() {
  if (!allCoins.length) return;
  const sort   = document.getElementById('scan-sort').value;
  const maxR   = parseInt(document.getElementById('scan-risk').value);
  const search = document.getElementById('scan-search').value.toLowerCase();

  let coins = allCoins.filter(c =>
    c.risk_score <= maxR &&
    (!search || c.name.toLowerCase().includes(search) || c.symbol.toLowerCase().includes(search))
  );
  coins.sort((a,b) => sort==='risk_asc' ? a.risk_score-b.risk_score : (b[sort]||0)-(a[sort]||0));

  document.getElementById('table-wrap').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>Asset</th><th>Score</th><th>1h</th><th>24h</th><th>7d</th><th>Rischio</th><th>Vol/Cap</th>
        </tr></thead>
        <tbody>${coins.slice(0,80).map((c,i) => {
          const scoreCol = c.gem_level==='forte'?'var(--green)':c.gem_level==='buona'?'var(--gold)':'var(--muted)';
          const riskCol  = c.risk_score<=3?'var(--green)':c.risk_score<=6?'var(--gold)':'var(--red)';
          return `<tr>
            <td style="color:var(--muted);font-size:11px">${i+1}</td>
            <td><div class="ci"><img class="cimg" src="${c.image}" onerror="this.style.display='none'" loading="lazy">
              <div><div style="font-weight:700">${c.symbol.toUpperCase()}</div><div style="font-size:10px;color:var(--muted)">${c.name}</div></div></div></td>
            <td style="color:${scoreCol};font-weight:700">${c.gem_score}</td>
            <td class="${c.p1h>=0?'up':'down'}">${fmt(c.p1h)}%</td>
            <td class="${c.p24h>=0?'up':'down'}">${fmt(c.p24h)}%</td>
            <td class="${c.p7d>=0?'up':'down'}">${fmt(c.p7d)}%</td>
            <td style="color:${riskCol}">${c.risk_score}/10</td>
            <td style="color:var(--cyan)">${(c.volume_spike*100).toFixed(1)}%</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>`;
}

function fmt(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2);
}
function fmtPrice(p) {
  if (!p) return '—';
  if (p >= 1000) return p.toLocaleString('en-US',{maximumFractionDigits:0});
  if (p >= 1)    return p.toFixed(2);
  if (p >= 0.001) return p.toFixed(4);
  return p.toFixed(6);
}
function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

// Auto-refresh every 5 min
setInterval(loadData, 5 * 60 * 1000);
loadData();
</script>
</body>
</html>
