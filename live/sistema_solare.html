.card3d{position:relative;width:min(440px,92vw);border-radius:22px;padding:2px;background:linear-gradient(135deg,#3a3a48,#0c0c12 30%,#1a1a24 50%,#0c0c12 70%,#45454f);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);transform:perspective(1100px) rotateX(8deg) translateY(20px) scale(.94);transition:transform .45s cubic-bezier(.2,.9,.25,1.1);animation:cardFloat 6s ease-in-out infinite}

@keyframes cardFloat{0%,100%{margin-top:0}50%{margin-top:-10px}}

.card-close{position:absolute;top:14px;right:16px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}

#label{position:fixed;z-index:8;pointer-events:none;font-family:'Anton','Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;padding:5px 12px;background:rgba(10,10,16,.85);border:1px solid rgba(232,80,26,.5);border-radius:8px;color:#fff;display:none;transform:translate(-50%,-160%);white-space:nowrap}
#loader{position:fixed;inset:0;z-index:30;background:#03030a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}

.spinner{width:46px;height:46px;border:3px solid #1c1c28;border-top-color:#FB6B00;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

<script>
/* 81+ UNIVERSO. HUB1 sole centrale. HUB2 e HUB3 sotto-sistemi inclinati
   in orbita ellittica attorno al centro. 8+8 pianeti, orbite ellittiche
   tutte diverse, 1-3 satelliti per pianeta, navicelle, stelle scintillanti. */

// I 3 SOLI. HUB2 inclinato +45, HUB3 inclinato -45, entrambi orbitano il centro
const HUBS = [
  {nome:"81+",  col:0xFB6B00, size:3.4, incl:0,    orbA:0,  orbB:0,  vel:0,     fase:0,        desc:"HUB1, il cuore. 81plus.net"},
  {nome:"HUB2", col:0x3FBF6B, size:2.5, incl:0.785, orbA:42, orbB:30, vel:0.045, fase:0,        desc:"HUB2, economia reale Web2. sicurissimo.online"},
  {nome:"HUB3", col:0x00D9FF, size:2.5, incl:-0.785,orbA:42, orbB:30, vel:0.045, fase:Math.PI,  desc:"HUB3, blockchain Web3. 81plus.online"},
];

// 16 PIANETI, 8 per HUB2 e 8 per HUB3. Ognuno fisicamente diverso.
// hub: indice del sole. a,b: semiassi ellisse. vel: velocita. size, tilt, sat: numero satelliti, tex: stile
const PIANETI = [
  // HUB2, Web2, economia reale
  {nome:"ACADEMY", hub:1, dom:"https://81plus.net/academy.html",     col:0x3FBF6B, a:7.5, b:6.2, vel:0.42, size:1.5, sat:2, tex:'roccia', desc:"La formazione a strati. Sicurezza, HACCP, privacy. Tre livelli sbloccabili con i PV."},
  {nome:"SHOP",    hub:1, dom:"https://81plus.net/81plus.shop/",     col:0xE8501A, a:10,  b:8.4, vel:0.34, size:1.7, sat:1, tex:'gas',    desc:"Lo store dell'ecosistema. DPI, sicurezza, gadget. Senza magazzino, spedizione diretta."},
  {nome:"CLUB",    hub:1, dom:"https://81plus.net/81plus.club/",     col:0xFFD24A, a:12.6,b:10,  vel:0.29, size:1.4, sat:2, tex:'roccia', desc:"Il club VIP. Palladium, Iridium, Rhodium. Status e community esclusiva."},
  {nome:"ZONE",    hub:1, dom:"https://81plus.net/81plus.zone/",     col:0xE84A6F, a:15,  b:12.5,vel:0.24, size:1.6, sat:3, tex:'gas',    desc:"Il franchising fisico. Apri la tua sede 81+. Light, Standard, Flagship."},
  {nome:"NETWORK", hub:1, dom:"https://81plus.net/81plus.network/",  col:0x4AE8C0, a:17.8,b:14.2,vel:0.20, size:1.3, sat:1, tex:'roccia', desc:"Il network commerciale. Le commissioni nascono solo da vendite reali, L.173 del 2005."},
  {nome:"STORE",   hub:1, dom:"https://81plus.net/81plus.store/",    col:0xE8A04A, a:20.5,b:16,  vel:0.17, size:1.5, sat:2, tex:'gas',    desc:"Il negozio prodotti fisici e digitali. Catalogo completo dell'ecosistema."},
  {nome:"CARDS",   hub:1, dom:"https://81plus.net/81plus.cards/",    col:0x9FE84A, a:23,  b:18.6,vel:0.15, size:1.2, sat:1, tex:'roccia', desc:"Le tessere e le membership digitali. La tua identita 81+ in tasca."},
  {nome:"PLACE",   hub:1, dom:"https://81plus.net/81plus.place/",    col:0x4A8FE8, a:25.5,b:20.4,vel:0.13, size:1.4, sat:2, tex:'gas',    desc:"Le sedi sul territorio. Trova e prenota i punti 81+ vicino a te."},
  // HUB3, Web3, blockchain
  {nome:"EXCHANGE",hub:2, dom:"https://81plus.net/81plus.exchange/", col:0x00D9FF, a:7.5, b:6.2, vel:0.40, size:1.5, sat:1, tex:'cristallo',desc:"Il DEX on-chain. Scambio SAF e 81X su Binance Smart Chain, BEP-20."},
  {nome:"WORLD",   hub:2, dom:"https://81plus.net/81plus.world/",    col:0x8A4AE8, a:10,  b:8.4, vel:0.33, size:1.7, sat:3, tex:'gas',    desc:"Il metaverso 81+. Avatar Ready Player Me, mondi e esperienze immersive."},
  {nome:"DIGITAL", hub:2, dom:"https://81plus.net/81plus.digital/",  col:0xFF6AD9, a:12.6,b:10,  vel:0.28, size:1.4, sat:2, tex:'cristallo',desc:"Gli asset digitali. NFT DIGITAL, sigilli verificabili su blockchain."},
  {nome:"BOND",    hub:2, dom:"https://81plus.net/81plus.bond/",     col:0x4AE8FF, a:15,  b:12.5,vel:0.23, size:1.6, sat:1, tex:'cristallo',desc:"I bond tokenizzati. Strumenti di valore verificabili on-chain."},
  {nome:"CREDIT",  hub:2, dom:"https://81plus.net/81plus.credit/",   col:0x6A8AFF, a:17.8,b:14.2,vel:0.19, size:1.3, sat:2, tex:'gas',    desc:"I crediti e la DeFi dell'ecosistema. PV, SAF e utilita interne."},
  {nome:"CLOUD",   hub:2, dom:"https://81plus.net/81plus.cloud/",    col:0xAFCFFF, a:20.5,b:16,  vel:0.16, size:1.5, sat:1, tex:'gas',    desc:"L'infrastruttura cloud. Dati, API e servizi dell'ecosistema."},
  {nome:"SPACE",   hub:2, dom:"https://81plus.net/81plus.space/",    col:0xB14AE8, a:23,  b:18.6,vel:0.14, size:1.2, sat:3, tex:'cristallo',desc:"Lo spazio virtuale 81+. Aree riservate ed esperienze nel Web3."},
  {nome:"ORG",     hub:2, dom:"https://81plus.net/81plus.org/",      col:0x4AFFD2, a:25.5,b:20.4,vel:0.12, size:1.4, sat:2, tex:'cristallo',desc:"La DAO di governance. Le decisioni della community, in trasparenza."},
];

let scene, camera, renderer, raycaster, mouse;
let hubMesh=[], hubGlow=[], pianetiMesh=[], navicelle=[];
let pianetaTarget=null, pianetaHover=null;
let camLook={x:0,y:0,z:0}, camLookTarget={x:0,y:0,z:0};
let dragging=false, lastX=0, lastY=0, rotY=0.5, rotX=0.35, autoRot=true;
let raggio=70;
const clock={t:0};

// --- TEXTURE PROCEDURALI diverse per tipo pianeta ---
function makeTexture(tipo, col){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const x=c.getContext('2d');
  const base=new THREE.Color(col);
  const r=Math.floor(base.r*255), g=Math.floor(base.g*255), b=Math.floor(base.b*255);
  x.fillStyle=`rgb(${r},${g},${b})`; x.fillRect(0,0,256,256);
  if(tipo==='roccia'){
    for(let i=0;i<900;i++){const px=Math.random()*256,py=Math.random()*256,rad=Math.random()*7+1;
      const sh=Math.random()*0.5-0.25;
      x.fillStyle=`rgba(${r*(1+sh)|0},${g*(1+sh)|0},${b*(1+sh)|0},.5)`;
      x.beginPath();x.arc(px,py,rad,0,7);x.fill();}
  } else if(tipo==='gas'){
    for(let y=0;y<256;y+=3){const sh=Math.sin(y*0.08)*0.3+(Math.random()*0.16-0.08);
      x.fillStyle=`rgba(${r*(1+sh)|0},${g*(1+sh)|0},${b*(1+sh)|0},.55)`;
      x.fillRect(0,y,256,3);}
  } else { // cristallo
    for(let i=0;i<60;i++){const px=Math.random()*256,py=Math.random()*256,s=Math.random()*40+10;
      x.strokeStyle=`rgba(255,255,255,${Math.random()*0.25})`;x.lineWidth=Math.random()*2;
      x.beginPath();x.moveTo(px,py);x.lineTo(px+s,py+s*0.5);x.stroke();}
  }
  const t=new THREE.CanvasTexture(c); return t;
}

function init(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x03030a,0.006);
  camera=new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 3000);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scena'),antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2(-2,-2);
  scene.add(new THREE.AmbientLight(0x405060,1.0));

  // --- CAMPO STELLARE, magnitudini diverse che scintillano ---
  const sg=new THREE.BufferGeometry(), sp=[], sc=[], ssz=[];
  for(let i=0;i<2600;i++){
    const r=300+Math.random()*900, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    sp.push(r*Math.sin(p)*Math.cos(t), r*Math.sin(p)*Math.sin(t), r*Math.cos(p));
    const mag=Math.random();
    const tint=mag>0.92?[0.7,0.8,1]:mag>0.8?[1,0.9,0.7]:[1,1,1];
    sc.push(...tint); ssz.push(mag*2+0.4);
  }
  sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  sg.setAttribute('color',new THREE.Float32BufferAttribute(sc,3));
  sg.setAttribute('size',new THREE.Float32BufferAttribute(ssz,1));
  const starMat=new THREE.PointsMaterial({size:1.6,vertexColors:true,transparent:true,opacity:.9});
  window.__stars=new THREE.Points(sg,starMat); scene.add(window.__stars);

  // --- I 3 SOLI ---
  HUBS.forEach((h,i)=>{
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(h.size,48,48), new THREE.MeshBasicMaterial({color:h.col}));
    mesh.userData={tipo:'hub',idx:i,nome:h.nome};
    scene.add(mesh); hubMesh.push(mesh);
    const gl=new THREE.Mesh(new THREE.SphereGeometry(h.size*1.5,32,32), new THREE.MeshBasicMaterial({color:h.col,transparent:true,opacity:.16}));
    scene.add(gl);
    const gl2=new THREE.Mesh(new THREE.SphereGeometry(h.size*2.4,32,32), new THREE.MeshBasicMaterial({color:h.col,transparent:true,opacity:.07}));
    scene.add(gl2);
    hubGlow.push([gl,gl2]);
    const light=new THREE.PointLight(h.col,2.0,200); scene.add(light); mesh.userData.light=light;
  });

  // --- PIANETI con texture, satelliti, anello orbitale ellittico ---
  PIANETI.forEach((p,i)=>{
    const tex=makeTexture(p.tex,p.col);
    const m=new THREE.MeshStandardMaterial({map:tex,color:p.col,metalness:.4,roughness:.55,emissive:p.col,emissiveIntensity:.08});
    const mesh=new THREE.Mesh(new THREE.SphereGeometry(p.size,36,36),m);
    mesh.userData={tipo:'pianeta',idx:i,nome:p.nome,ang:Math.random()*Math.PI*2,tilt:Math.random()*0.5-0.25,sats:[]};
    scene.add(mesh); pianetiMesh.push(mesh);
    // satelliti
    for(let s=0;s<p.sat;s++){
      const sm=new THREE.Mesh(new THREE.SphereGeometry(p.size*0.22,16,16), new THREE.MeshStandardMaterial({color:0xcccccc,roughness:.8}));
      sm.userData={dist:p.size+0.8+s*0.6, vel:1.5+s*0.7, ang:Math.random()*6.28};
      scene.add(sm); mesh.userData.sats.push(sm);
    }
    // alone
    const ph=new THREE.Mesh(new THREE.SphereGeometry(p.size*1.25,20,20), new THREE.MeshBasicMaterial({color:p.col,transparent:true,opacity:.1}));
    mesh.userData.halo=ph; scene.add(ph);
  });

  // --- NAVICELLE che viaggiano tra pianeti ---
  for(let i=0;i<5;i++){
    const grp=new THREE.Group();
    const body=new THREE.Mesh(new THREE.ConeGeometry(0.18,0.7,8), new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xFB6B00,emissiveIntensity:.4,metalness:.8,roughness:.2}));
    body.rotation.x=Math.PI/2; grp.add(body);
    const trail=new THREE.Mesh(new THREE.ConeGeometry(0.08,1.2,6), new THREE.MeshBasicMaterial({color:0xFB6B00,transparent:true,opacity:.4}));
    trail.rotation.x=-Math.PI/2; trail.position.z=-0.7; grp.add(trail);
    grp.userData={da:Math.floor(Math.random()*PIANETI.length),a:Math.floor(Math.random()*PIANETI.length),t:Math.random()};
    scene.add(grp); navicelle.push(grp);
  }

  aggiornaPosizioni(0);
  addEventi(); animate();
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),800);
}

// posizione di un hub sulla sua ellisse attorno al centro
function hubPos(h){
  if(h.orbA===0) return new THREE.Vector3(0,0,0);
  const a=clock.t*h.vel+h.fase;
  let x=Math.cos(a)*h.orbA, z=Math.sin(a)*h.orbB, y=0;
  // inclinazione del piano orbitale
  const yy=y*Math.cos(h.incl)-z*Math.sin(h.incl);
  const zz=y*Math.sin(h.incl)+z*Math.cos(h.incl);
  return new THREE.Vector3(x,yy,zz);
}

function aggiornaPosizioni(dt){
  // soli
  HUBS.forEach((h,i)=>{
    const pos=hubPos(h);
    hubMesh[i].position.copy(pos);
    hubGlow[i][0].position.copy(pos); hubGlow[i][1].position.copy(pos);
    if(hubMesh[i].userData.light) hubMesh[i].userData.light.position.copy(pos);
    hubMesh[i].rotation.y+=0.002;
  });
  // pianeti, orbita ellittica attorno al proprio sole, sul piano inclinato del sole
  PIANETI.forEach((p,i)=>{
    const mesh=pianetiMesh[i], h=HUBS[p.hub], hp=hubPos(h);
    const fermo=(mesh===pianetaHover||mesh===pianetaTarget);
    if(!fermo) mesh.userData.ang+=p.vel*dt;
    const a=mesh.userData.ang;
    let x=Math.cos(a)*p.a, z=Math.sin(a)*p.b, y=Math.sin(a*1.4)*0.5+mesh.userData.tilt;
    // applico inclinazione del piano del sole
    const yy=y*Math.cos(h.incl)-z*Math.sin(h.incl);
    const zz=y*Math.sin(h.incl)+z*Math.cos(h.incl);
    mesh.position.set(hp.x+x, hp.y+yy, hp.z+zz);
    mesh.rotation.y+=0.012;
    if(mesh.userData.halo) mesh.userData.halo.position.copy(mesh.position);
    // satelliti
    mesh.userData.sats.forEach(sm=>{
      sm.userData.ang+=sm.userData.vel*dt;
      sm.position.set(
        mesh.position.x+Math.cos(sm.userData.ang)*sm.userData.dist,
        mesh.position.y+Math.sin(sm.userData.ang*1.3)*sm.userData.dist*0.4,
        mesh.position.z+Math.sin(sm.userData.ang)*sm.userData.dist
      );
    });
  });
  // navicelle, viaggiano da pianeta a pianeta
  navicelle.forEach(nv=>{
    nv.userData.t+=dt*0.12;
    if(nv.userData.t>=1){ nv.userData.da=nv.userData.a; nv.userData.a=Math.floor(Math.random()*PIANETI.length); nv.userData.t=0; }
    const A=pianetiMesh[nv.userData.da].position, B=pianetiMesh[nv.userData.a].position;
    const t=nv.userData.t;
    const arc=Math.sin(t*Math.PI)*4;
    nv.position.set(A.x+(B.x-A.x)*t, A.y+(B.y-A.y)*t+arc, A.z+(B.z-A.z)*t);
    nv.lookAt(B);
  });
}

function addEventi(){
  const cv=renderer.domElement;
  cv.addEventListener('mousemove',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;rotY+=dx*0.005;rotX+=dy*0.005;rotX=Math.max(-1.2,Math.min(1.2,rotX));lastX=e.clientX;lastY=e.clientY;autoRot=false;}
    aggiornaLabel(e.clientX,e.clientY);
  },{passive:true});
  cv.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener('mouseup',()=>dragging=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();raggio+=e.deltaY*0.03;raggio=Math.max(10,Math.min(140,raggio));},{passive:false});
  cv.addEventListener('click',e=>{
    if(Math.abs(e.clientX-lastX)>6||Math.abs(e.clientY-lastY)>6)return;
    raycaster.setFromCamera(mouse,camera);
    const hit=raycaster.intersectObjects(pianetiMesh)[0];
    if(hit)apriCard(hit.object.userData.idx);
  });
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;mouse.x=(lastX/innerWidth)*2-1;mouse.y=-(lastY/innerHeight)*2+1;}},{passive:true});
  cv.addEventListener('touchmove',e=>{if(e.touches.length===1&&dragging){const t=e.touches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;rotY+=dx*0.005;rotX+=dy*0.005;rotX=Math.max(-1.2,Math.min(1.2,rotX));lastX=t.clientX;lastY=t.clientY;autoRot=false;mouse.x=(t.clientX/innerWidth)*2-1;mouse.y=-(t.clientY/innerHeight)*2+1;}},{passive:true});
  cv.addEventListener('touchend',e=>{dragging=false;raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(pianetiMesh)[0];if(hit)apriCard(hit.object.userData.idx);});
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

function aggiornaLabel(px,py){
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects(pianetiMesh)[0];
  const lab=document.getElementById('label');
  if(hit){pianetaHover=hit.object;pianetaTarget=hit.object;lab.textContent=hit.object.userData.nome;lab.style.left=px+'px';lab.style.top=py+'px';lab.style.display='block';document.body.style.cursor='pointer';}
  else{pianetaHover=null;lab.style.display='none';document.body.style.cursor='grab';}
}

function animate(){
  requestAnimationFrame(animate);
  const dt=0.016; clock.t+=dt;
  aggiornaPosizioni(dt);
  HUBS.forEach((h,i)=>{const k=1+Math.sin(clock.t*1.5+i)*0.04;hubMesh[i].scale.setScalar(k);});
  if(window.__stars) window.__stars.material.opacity=0.7+Math.sin(clock.t*2)*0.15; // scintillio
  if(pianetaTarget){
    camLookTarget.x+=(pianetaTarget.position.x-camLookTarget.x)*0.06;
    camLookTarget.y+=(pianetaTarget.position.y-camLookTarget.y)*0.06;
    camLookTarget.z+=(pianetaTarget.position.z-camLookTarget.z)*0.06;
    raggio+=(14-raggio)*0.04;
  } else {
    camLookTarget.x+=(0-camLookTarget.x)*0.05;camLookTarget.y+=(0-camLookTarget.y)*0.05;camLookTarget.z+=(0-camLookTarget.z)*0.05;
  }
  if(autoRot)rotY+=0.0005;
  const cx=camLookTarget.x+Math.sin(rotY)*Math.cos(rotX)*raggio;
  const cy=camLookTarget.y+Math.sin(rotX)*raggio+8;
  const cz=camLookTarget.z+Math.cos(rotY)*Math.cos(rotX)*raggio;
  camera.position.x+=(cx-camera.position.x)*0.07;
  camera.position.y+=(cy-camera.position.y)*0.07;
  camera.position.z+=(cz-camera.position.z)*0.07;
  camLook.x+=(camLookTarget.x-camLook.x)*0.08;camLook.y+=(camLookTarget.y-camLook.y)*0.08;camLook.z+=(camLookTarget.z-camLook.z)*0.08;
  camera.lookAt(camLook.x,camLook.y,camLook.z);
  renderer.render(scene,camera);
}

function apriCard(idx){
  const p=PIANETI[idx], h=HUBS[p.hub];
  document.getElementById('cardTitle').textContent=p.nome;
  document.getElementById('cardDesc').textContent=p.desc;
  const hub=document.getElementById('cardHub');
  hub.textContent=h.nome+(p.hub===1?' · Web2':' · Web3');
  const hc='#'+h.col.toString(16).padStart(6,'0');
  hub.style.background=hc+'22'; hub.style.color=hc; hub.style.border='1px solid '+hc;
  const link=document.getElementById('cardLink');
  link.href=p.dom; link.textContent='Entra in '+p.nome;
  const hex='#'+p.col.toString(16).padStart(6,'0');
  const orb=document.getElementById('cardOrb');
  orb.style.background='radial-gradient(circle at 35% 30%, #fff, '+hex+' 45%, #0a0a10)';
  orb.style.color=hex;
  document.querySelector('.card-title').style.color=hex;
  document.getElementById('cardWrap').classList.add('on');
}
function chiudiCard(){document.getElementById('cardWrap').classList.remove('on');}
function resetVista(){pianetaTarget=null;pianetaHover=null;raggio=70;rotX=0.35;autoRot=true;camLookTarget={x:0,y:0,z:0};}
document.getElementById('cardWrap').addEventListener('click',e=>{if(e.target.id==='cardWrap')chiudiCard();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')chiudiCard();});

if(window.THREE){init();}
else{document.getElementById('loader').innerHTML='<p style="color:#E8501A">Errore caricamento 3D. Ricarica.</p>';}
</script>
