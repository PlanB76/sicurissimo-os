services:
  hub1:
    build: .
    ports: ["8080:80"]
    env_file: .env
    depends_on: [db]
    volumes: ["./:/var/www/html"]
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports: ["3306:3306"]
    volumes: ["./sql:/docker-entrypoint-initdb.d","dbdata:/var/lib/mysql"]
volumes: { dbdata: {} }
