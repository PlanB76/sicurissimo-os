<!DOCTYPE html>
<html lang="it" data-lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>81+ · Avvisi direzione</title>
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--o:#E8501A;--o2:#FB6B00;--v:#3FBF6B;--bg:#0A0A0B;--c:#141417;--bd:#26262b;--tx:#c4c4cc;--mu:#8a8a92}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Sora',sans-serif;line-height:1.6}
.w{max-width:820px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
.hero{padding:34px 0 10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hero h1{font-family:'Anton';font-size:32px;color:#fff}
.hero .badge{background:var(--o);color:#fff;font-weight:700;padding:4px 12px;border-radius:20px;font-size:13px}
.filtri{display:flex;gap:8px;margin:14px 0}
.filtri button{background:var(--c);border:1px solid var(--bd);color:var(--tx);padding:7px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.filtri button.on{background:var(--o);border-color:var(--o);color:#fff}
.avviso{background:var(--c);border:1px solid var(--bd);border-left:4px solid var(--mu);border-radius:12px;padding:14px 18px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.avviso.alta{border-left-color:var(--o)}
.avviso.media{border-left-color:#FFD24A}
.avviso.bassa{border-left-color:var(--v)}
.avviso.nonletto{background:#16161c}
.avviso .ic{font-size:22px}
.avviso .b{flex:1;min-width:0}
.avviso .t{color:#fff;font-weight:600;font-size:14px}
.avviso .d{font-size:13px;color:var(--mu);margin-top:2px}
.avviso .meta{font-size:11px;color:var(--mu);font-family:'JetBrains Mono';margin-top:4px}
.avviso .ck{background:transparent;border:1px solid var(--bd);color:var(--mu);padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer;white-space:nowrap}
.vuoto{text-align:center;padding:50px;color:var(--mu)}.vuoto a{color:var(--o)}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;background:var(--c);border:1px solid var(--v);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;display:none}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="w">
<div class="hero">
  <h1>Avvisi direzione</h1>
  <span class="badge" id="nl">0 non letti</span>
</div>
<div class="filtri">
  <button class="on" onclick="setF(this,'')">Tutti</button>
  <button onclick="setF(this,'nonletti')">Non letti</button>
  <button onclick="segnaTutti()" style="margin-left:auto;border-color:var(--v);color:var(--v)">Segna tutti letti</button>
</div>
<div id="lista"></div>
</div>
<script>
let FILTRO='';
const ICONE={abbonamento_disdetto:'🚫',abbonamento_sospeso:'⏸️',abbonamento_recesso:'⚠️',pagamento:'💳',default:'🔔'};
async function carica(){
  try{
    const r=await fetch('api/admin_avvisi.php?az=lista'+(FILTRO?'&solo='+FILTRO:'')); const d=await r.json();
    if(!d.ok){ document.getElementById('lista').innerHTML='<div class="vuoto">Accesso riservato alla direzione. <a href="login.html">Accedi</a></div>'; return; }
    document.getElementById('nl').textContent=d.non_letti+' non letti';
    if(!d.avvisi.length){ document.getElementById('lista').innerHTML='<div class="vuoto">Nessun avviso.</div>'; return; }
    render(d.avvisi);
  }catch(e){ demo(); }
}
function demo(){
  document.getElementById('nl').textContent='2 non letti';
  render([
    {id:1,tipo:'abbonamento_recesso',sic:'SIC-0000042',titolo:'RECESSO richiesto, club_palladium',dettaglio:'L utente ha esercitato il recesso. Va gestito secondo i termini di legge.',gravita:'alta',letto:0,created_at:'2026-06-12T10:00:00Z'},
    {id:2,tipo:'abbonamento_disdetto',sic:'SIC-0000128',titolo:'Abbonamento disdetto, membership_pro',dettaglio:'Motivo, troppo caro. Se in euro fermare il pagamento PayPal.',gravita:'media',letto:0,created_at:'2026-06-12T09:30:00Z'},
    {id:3,tipo:'abbonamento_sospeso',sic:'SIC-0000077',titolo:'Abbonamento sospeso, rdp_drive',dettaglio:'Sospensione temporanea.',gravita:'bassa',letto:1,created_at:'2026-06-11T18:00:00Z'}
  ]);
}
function render(av){
  document.getElementById('lista').innerHTML=av.map(a=>`
    <div class="avviso ${a.gravita} ${a.letto?'':'nonletto'}">
      <div class="ic">${ICONE[a.tipo]||ICONE.default}</div>
      <div class="b">
        <div class="t">${a.titolo}</div>
        <div class="d">${a.dettaglio||''}</div>
        <div class="meta">${a.sic||'-'} · ${new Date(a.created_at).toLocaleString('it-IT')}</div>
      </div>
      ${a.letto?'':`<button class="ck" onclick="segna(${a.id})">Segna letto</button>`}
    </div>`).join('');
}
function setF(btn,f){ document.querySelectorAll('.filtri button').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); FILTRO=f; carica(); }
async function segna(id){ await fetch('api/admin_avvisi.php?az=letto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}); carica(); }
async function segnaTutti(){ await fetch('api/admin_avvisi.php?az=letto',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}); toast('Tutti segnati letti'); carica(); }
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.style.display='block'; setTimeout(()=>e.style.display='none',3000); }
carica();
</script>
<script src="sito81.js" defer></script>
</body>
</html>
