<!DOCTYPE html>
<html lang="it" data-lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>81+ · La tua partita, livelli, missioni, badge e booster</title>
<meta name="description" content="Il tuo stato di gioco nell'ecosistema 81+. Livello, esperienza, missioni, badge, booster e benefit. Tutto misurato in PV.">
<link rel="icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--o:#E8501A;--o2:#FB6B00;--v:#3FBF6B;--bg:#0A0A0B;--c:#141417;--bd:#26262b;--tx:#c4c4cc;--mu:#8a8a92}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:'Sora',sans-serif;line-height:1.6}
.w{max-width:920px;margin:0 auto;padding:0 20px}
a{color:inherit;text-decoration:none}
.hero{padding:38px 0 10px;text-align:center}
.tag{display:inline-block;background:rgba(232,80,26,.12);border:1px solid var(--o);color:var(--o);font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;text-transform:uppercase}
h1{font-family:'Anton';font-size:clamp(28px,5vw,44px);color:#fff;margin:12px 0 6px}
.hero p{color:var(--mu);font-size:15px;max-width:520px;margin:0 auto}
.livello-box{background:linear-gradient(135deg,rgba(232,80,26,.12),rgba(138,74,232,.06));border:1px solid var(--o);border-radius:18px;padding:24px;margin:20px 0;text-align:center}
.livello-box .ic{font-size:48px}
.livello-box .nm{font-family:'Anton';font-size:30px;color:#fff;margin:4px 0}
.livello-box .pv{font-family:'JetBrains Mono';font-size:13px;color:var(--o2)}
.barra{height:10px;background:#0e0e14;border-radius:6px;overflow:hidden;margin:14px auto 6px;max-width:400px}
.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--o2))}
.next{font-size:12px;color:var(--mu)}
.molt{display:inline-block;background:rgba(63,191,107,.15);color:var(--v);font-weight:700;padding:5px 14px;border-radius:20px;font-size:14px;margin-top:10px}
.sez{margin:26px 0}
.sez h2{font-family:'Anton';color:#fff;font-size:22px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sez .cnt{font-size:13px;color:var(--mu);margin-bottom:14px}
.missioni{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:680px){.missioni{grid-template-columns:1fr}}
.mis{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.mis.ok{border-color:#3FBF6B55}
.mis .ck{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.mis.ok .ck{background:var(--v);color:#062e16}
.mis .ck.no{background:#26262b;color:var(--mu)}
.mis .b .t{color:#fff;font-weight:600;font-size:14px}
.mis .b .d{font-size:12px;color:var(--mu)}
.mis .pv{margin-left:auto;color:var(--v);font-family:'JetBrains Mono';font-size:13px;white-space:nowrap}
.cat-tag{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--o2);background:rgba(232,80,26,.1);padding:1px 6px;border-radius:4px;margin-left:6px}
.griglia{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:680px){.griglia{grid-template-columns:repeat(2,1fr)}}
.badge{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center}
.badge.off{opacity:.4;filter:grayscale(.7)}
.badge .ic{font-size:30px}
.badge .nm{font-size:13px;color:#fff;font-weight:600;margin:4px 0}
.badge .d{font-size:11px;color:var(--mu)}
.lista{display:flex;flex-direction:column;gap:8px}
.item{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px}
.item.off{opacity:.45}
.item .dot{width:8px;height:8px;border-radius:50%;background:var(--v);flex-shrink:0}
.item.off .dot{background:var(--mu)}
.item .t{color:#fff;font-size:14px}
.item .d{font-size:12px;color:var(--mu);margin-left:auto;text-align:right}
.note{font-size:12px;color:var(--mu);text-align:center;max-width:560px;margin:24px auto 30px}
.login-msg{text-align:center;padding:50px;color:var(--mu)}.login-msg a{color:var(--o)}
</style>
</head>
<body>
<div class="w">
<section class="hero">
  <span class="tag">La tua partita</span>
  <h1>Livelli, missioni, badge</h1>
  <p>Ogni azione nell'ecosistema ti fa salire. Esperienza, missioni, badge e booster, tutto misurato in PV.</p>
</section>
<div id="contenuto"></div>
</div>

<script>
async function carica(){
  try{
    const r=await fetch('api/gamification.php'); const d=await r.json();
    if(!d.ok){ document.getElementById('contenuto').innerHTML='<div class="login-msg">Accedi dalla <a href="login.html">dashboard</a> per vedere la tua partita.</div>'; return; }
    render(d);
  }catch(e){ demo(); }
}
function demo(){
  render({ok:true,xp:700,saldo_pv:340,livello:{liv:2,nome:'Operativo',icona:'🛡️',da:300,colore:'#CD7F32'},prossimo:{nome:'Veterano',da:800},
    moltiplicatore:2,booster:[{nome:'Booster Genesi',desc:'x2 a vita',molt:2}],
    missioni:[{nome:'Entra nell ecosistema',desc:'SIC-ID creato',pv:100,cat:'onboarding',fatta:true},{nome:'Completa il profilo',desc:'Nome e telefono',pv:100,cat:'onboarding',fatta:true},{nome:'Fai l audit',desc:'30 controlli',pv:25,cat:'onboarding',fatta:false},{nome:'Attiva membership',desc:'Basic Pro Elite',pv:200,cat:'membership',fatta:false},{nome:'Primo PIX81+',desc:'Founding Node',pv:150,cat:'metaverso',fatta:true},{nome:'Invita un amico',desc:'Link o QR',pv:25,cat:'network',fatta:false}],
    missioni_fatte:3,missioni_totali:6,
    badge:[{nome:'Azienda Virtuosa',icona:'🏅',desc:'30 giorni',ottenuto:false},{nome:'Founder Node',icona:'🧱',desc:'Hai un PIX',ottenuto:true},{nome:'Evangelista',icona:'📣',desc:'5 invitati',ottenuto:false},{nome:'Pioniere Web3',icona:'🚀',desc:'Primo Web3',ottenuto:false}],
    benefit:[{nome:'Sconto 5% sui servizi',desc:'Dal liv. 2',attivo:true},{nome:'Accesso anticipato corsi',desc:'Dal liv. 3',attivo:false}],
    premi:[{nome:'Mese Basic in regalo',pv:500,raggiunto:true},{nome:'Sigillo Bronze 50%',pv:1500,raggiunto:false}]});
}

function render(d){
  const prog=d.prossimo?Math.min(100,(d.pv-d.livello.da)/(d.prossimo.da-d.livello.da)*100):100;
  let h=`
  <div class="livello-box">
    <div class="ic">${d.livello.icona}</div>
    <div class="nm" style="color:${d.livello.colore||'#fff'}">${d.livello.nome}</div>
    <div class="xp">${d.pv.toLocaleString('it-IT')} PV · saldo ${d.saldo_pv.toLocaleString('it-IT')} PV</div>
    <div class="barra"><span style="width:${prog}%"></span></div>
    <div class="next">${d.prossimo?'Ti mancano '+(d.prossimo.da-d.pv).toLocaleString('it-IT')+' PV per '+d.prossimo.nome:'Livello massimo raggiunto'}</div>
    ${d.moltiplicatore>1?`<div class="molt">⚡ Booster attivo x${d.moltiplicatore}</div>`:''}
  </div>`;

  // missioni
  h+=`<div class="sez"><h2>🎯 Missioni</h2><div class="cnt">${d.missioni_fatte} di ${d.missioni_totali} completate</div><div class="missioni">`;
  h+=d.missioni.map(m=>`<div class="mis ${m.fatta?'ok':''}">
    <div class="ck ${m.fatta?'':'no'}">${m.fatta?'✓':'•'}</div>
    <div class="b"><div class="t">${m.nome}<span class="cat-tag">${m.cat}</span></div><div class="d">${m.desc}</div></div>
    <div class="pv">+${m.pv}</div></div>`).join('');
  h+=`</div></div>`;

  // badge
  h+=`<div class="sez"><h2>🎖️ Badge</h2><div class="cnt">${d.badge.filter(b=>b.ottenuto).length} sbloccati su ${d.badge.length}</div><div class="griglia">`;
  h+=d.badge.map(b=>`<div class="badge ${b.ottenuto?'':'off'}"><div class="ic">${b.icona}</div><div class="nm">${b.nome}</div><div class="d">${b.desc}</div></div>`).join('');
  h+=`</div></div>`;

  // booster
  if(d.booster&&d.booster.length){
    h+=`<div class="sez"><h2>⚡ Booster attivi</h2><div class="lista">`;
    h+=d.booster.map(b=>`<div class="item"><span class="dot"></span><span class="t">${b.nome}</span><span class="d">${b.desc}</span></div>`).join('');
    h+=`</div></div>`;
  }

  // benefit
  if(d.benefit&&d.benefit.length){
    h+=`<div class="sez"><h2>🎁 Benefit</h2><div class="lista">`;
    h+=d.benefit.map(b=>`<div class="item ${b.attivo?'':'off'}"><span class="dot"></span><span class="t">${b.nome}</span><span class="d">${b.attivo?'attivo':b.desc}</span></div>`).join('');
    h+=`</div></div>`;
  }

  // premi soglia
  if(d.premi&&d.premi.length){
    h+=`<div class="sez"><h2>🏆 Premi a traguardo</h2><div class="lista">`;
    h+=d.premi.map(p=>`<div class="item ${p.raggiunto?'':'off'}"><span class="dot"></span><span class="t">${p.nome}</span><span class="d">${p.raggiunto?'raggiunto':p.pv.toLocaleString('it-IT')+' PV'}</span></div>`).join('');
    h+=`</div></div>`;
  }

  document.getElementById('contenuto').innerHTML=h;
}
carica();
</script>
<script src="sito81.js" defer></script>
<script src="lang81.js" defer></script>
</body>
</html>
