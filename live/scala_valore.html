<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La scala del valore 81+</title>
<meta name="description" content="Dal gratis al club, ogni passo della scala 81+ ti dà più tranquillità. Parti dall audit gratuito.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070709;color:#ececf2;font-family:Sora,Arial;min-height:100vh}
.hero{max-width:880px;margin:0 auto;padding:56px 20px 10px;text-align:center}
h1{font-family:Anton,Arial;font-size:clamp(30px,6vw,52px);text-transform:uppercase}
h1 span{color:#E8501A}
.hero p{color:#9aa0b4;max-width:620px;margin:14px auto 0;line-height:1.8;font-size:15px}
.why{max-width:880px;margin:34px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cer{background:#0d0d12;border:1px solid #1d1d26;border-radius:16px;padding:20px;text-align:center}
.cer b{font-family:Anton,Arial;color:#E8501A;font-size:15px;letter-spacing:1px}
.cer p{font-size:12.5px;color:#9aa0b4;line-height:1.7;margin-top:8px}
.scala{max-width:760px;margin:20px auto 40px;padding:0 20px}
.grad{display:flex;gap:14px;align-items:flex-start;background:#0d0d12;border:1px solid #1d1d26;border-radius:16px;padding:18px;margin-bottom:10px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.grad:hover{border-color:#E8501A;transform:translateX(4px)}
.liv{font-family:Anton,Arial;color:#E8501A;font-size:13px;letter-spacing:1px;min-width:86px;padding-top:2px}
.grad h3{font-size:15px;margin-bottom:4px}
.grad p{font-size:12.5px;color:#9aa0b4;line-height:1.7}
.fascia{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#ffb38a;margin-top:6px;display:block}
.pipe{max-width:760px;margin:0 auto 30px;padding:0 20px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pipe span{font-size:11px;color:#9aa0b4;border:1px solid #1d1d26;border-radius:20px;padding:6px 12px}
.pipe span:last-child{border-color:#1db954;color:#1db954}
.cta{display:block;width:fit-content;margin:10px auto 60px;background:#E8501A;color:#fff;padding:15px 30px;border-radius:12px;font-weight:700;text-decoration:none;box-shadow:0 8px 30px rgba(232,80,26,.35)}
</style>
</head>
<body>
<div class="hero">
  <h1>La scala del <span>valore.</span></h1>
  <p>Ogni passo ti dà più tranquillità del precedente. Parti gratis, sali quando vuoi tu, nessuno ti spinge. Questa è la mappa onesta di tutto quello che facciamo.</p>
</div>
<div class="why" id="why"></div>
<div class="scala" id="scala"></div>
<div class="pipe" id="pipe"></div>
<a class="cta" href="index.html#audit">Parti dal primo gradino, l'audit gratuito</a>
<script>
fetch('data/scala_valore.json').then(r=>r.json()).then(d=>{
  document.getElementById('why').innerHTML=
    '<div class="cer"><b>PERCHÉ</b><p>'+d.why+'</p></div>'+
    '<div class="cer"><b>COME</b><p>'+d.how+'</p></div>'+
    '<div class="cer"><b>COSA</b><p>'+d.what+'</p></div>';
  document.getElementById('scala').innerHTML=d.gradini.map(function(g){
    return '<a class="grad" href="'+g.url+'"><span class="liv">'+g.liv+'</span><span><h3>'+g.nome+'</h3><p>'+g.cosa+'</p><span class="fascia">'+g.fascia+'</span></span></a>';
  }).join('');
  document.getElementById('pipe').innerHTML=d.pipeline.map(function(p){return '<span>'+p+'</span>'}).join('');
});
</script>
<script src="sito81.js" defer></script>
<script src="lang81.js" defer></script>
</body>
</html>
