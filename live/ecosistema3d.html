['it','net'],['it','aca'],['net','zone'],['net','club'],['it','shop'],
['dig','dex'],['dex','world'],['dig','dao'],['dex','credit'],
['store','world'],['store','credit'],['credit','bond'],
['space','world'],['cloud','dig'],['cards','hub1'],['xmas','shop'],
['zone','net'],['club','net'],['place','world'],
];

const COLORS={1:'#E8501A',2:'#3FBF6B',3:'#00D9FF'};

// ===== THREE.JS SETUP =====
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));

const scene3=new THREE.Scene();
scene3.background=new THREE.Color(0x050508);
scene3.fog=new THREE.FogExp2(0x050508,0.02);

const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,100);
camera.position.set(0,8,16);camera.lookAt(0,0,0);

// Lights
const amb=new THREE.AmbientLight(0x222233,0.5);scene3.add(amb);
const dir=new THREE.DirectionalLight(0xffffff,0.8);dir.position.set(5,10,5);scene3.add(dir);
const pt=new THREE.PointLight(0xE8501A,1,30);pt.position.set(0,5,0);scene3.add(pt);

// Grid
const grid=new THREE.GridHelper(30,30,0x111122,0x0a0a15);scene3.add(grid);

// ===== CREATE NODES =====
const meshes={};const labels=[];const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();

NODES.forEach(n=>{
  const col=new THREE.Color(COLORS[n.hub]);
  // Sphere
  const geo=new THREE.IcosahedronGeometry(n.size*0.4,1);
  const mat=new THREE.MeshPhongMaterial({color:col,emissive:col,emissiveIntensity:0.3,transparent:true,opacity:0.85,wireframe:false});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(n.x,n.y,n.z);
  mesh.userData=n;
  scene3.add(mesh);
  meshes[n.id]=mesh;

  // Glow ring
  const ring=new THREE.RingGeometry(n.size*0.5,n.size*0.55,32);
  const rmat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.3,side:THREE.DoubleSide});
  const rmesh=new THREE.Mesh(ring,rmat);
  rmesh.position.copy(mesh.position);
  rmesh.rotation.x=-Math.PI/2;
  scene3.add(rmesh);

  // Label sprite
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='rgba(0,0,0,0)';ctx.fillRect(0,0,256,64);
  ctx.font='bold 18px system-ui';ctx.fillStyle='#ffffff';ctx.textAlign='center';
  ctx.fillText(n.name.replace('81plus.',''),128,24);
  ctx.font='12px system-ui';ctx.fillStyle='#888888';
  ctx.fillText(n.tipo.substring(0,25),128,44);
  const tex=new THREE.CanvasTexture(cv);
  const smat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sprite=new THREE.Sprite(smat);
  sprite.position.set(n.x,n.y+n.size*0.6+0.5,n.z);
  sprite.scale.set(3,0.75,1);
  scene3.add(sprite);
  labels.push(sprite);
});

// ===== CREATE EDGES =====
EDGES.forEach(([a,b])=>{
  const ma=meshes[a],mb=meshes[b];if(!ma||!mb)return;
  const points=[ma.position.clone(),mb.position.clone()];
  const geo=new THREE.BufferGeometry().setFromPoints(points);
  const hub=NODES.find(n=>n.id===a)?.hub||1;
  const col=new THREE.Color(COLORS[hub]);
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.15});
  const line=new THREE.Line(geo,mat);
  scene3.add(line);
});

// ===== PARTICLES on edges =====
const particles=[];
EDGES.forEach(([a,b])=>{
  const ma=meshes[a],mb=meshes[b];if(!ma||!mb)return;
  const hub=NODES.find(n=>n.id===a)?.hub||1;
  const geo=new THREE.SphereGeometry(0.04,4,4);
  const mat=new THREE.MeshBasicMaterial({color:COLORS[hub]});
  const p=new THREE.Mesh(geo,mat);
  p.userData={from:ma.position,to:mb.position,t:Math.random(),speed:0.002+Math.random()*0.003};
  scene3.add(p);
  particles.push(p);
});

// ===== ORBIT CONTROLS (manual) =====
let isDragging=false,prevX=0,prevY=0;
let camTheta=0,camPhi=0.5,camDist=18,camTarget=new THREE.Vector3(0,1,0);

canvas.addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY});
canvas.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  camTheta-=(e.clientX-prevX)*0.005;
  camPhi=Math.max(0.1,Math.min(Math.PI/2-0.1,camPhi-(e.clientY-prevY)*0.005));
  prevX=e.clientX;prevY=e.clientY;
});
canvas.addEventListener('mouseup',()=>isDragging=false);
canvas.addEventListener('mouseleave',()=>isDragging=false);
canvas.addEventListener('wheel',e=>{camDist=Math.max(5,Math.min(40,camDist+e.deltaY*0.02))});

// Touch
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){isDragging=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY}},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!isDragging||e.touches.length!==1)return;
  camTheta-=(e.touches[0].clientX-prevX)*0.005;
  camPhi=Math.max(0.1,Math.min(Math.PI/2-0.1,camPhi-(e.touches[0].clientY-prevY)*0.005));
  prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener('touchend',()=>isDragging=false);

// Click to select
canvas.addEventListener('click',e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(Object.values(meshes));
  if(hits.length>0){
    const node=hits[0].object.userData;
    if(node.id)showPanel(node);
  }
});

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){camTheta=0;camPhi=0.5;camDist=18;camTarget.set(0,1,0)}
  if(e.key==='ArrowLeft')camTheta+=0.1;
  if(e.key==='ArrowRight')camTheta-=0.1;
  if(e.key==='ArrowUp')camPhi=Math.min(Math.PI/2-0.1,camPhi+0.05);
  if(e.key==='ArrowDown')camPhi=Math.max(0.1,camPhi-0.05);
});

// ===== PANEL =====
let selectedMesh=null;
function showPanel(node){
  if(selectedMesh)selectedMesh.material.emissiveIntensity=0.3;
  selectedMesh=meshes[node.id];
  if(selectedMesh)selectedMesh.material.emissiveIntensity=0.8;

  const col=COLORS[node.hub];
  let h=`<h2 style="color:${col}">${node.icon} ${node.name}</h2>`;
  h+=`<div class="tag" style="background:${col}22;color:${col};border:1px solid ${col}">${node.tipo}</div>`;
  h+=`<div class="tag" style="background:#222;color:#888;border:1px solid #333">${node.status}</div>`;
  h+=`<h3 style="color:${col}">PERCHÉ</h3><p style="font-size:10px">${node.why}</p>`;
  h+=`<h3 style="color:${col}">COME</h3><p style="font-size:10px">${node.how}</p>`;
  h+=`<h3 style="color:${col}">COSA</h3><p style="font-size:10px">${node.what}</p>`;
  h+=`<h3 style="color:${col}">UTENTI</h3><p style="font-size:10px">${node.users}</p>`;
  if(node.products.length){
    h+=`<h3 style="color:${col}">PRODOTTI (${node.products.length})</h3>`;
    node.products.forEach(p=>{
      h+=`<div class="prod"><span class="pn">${p.n}</span> <span class="pp" style="color:${col}">${p.p}</span></div>`;
    });
  }
  if(node.ranking)h+=`<h3 style="color:#FFD24A">RANKING</h3><p style="font-size:9px;color:#FFD24A">${node.ranking}</p>`;
  if(node.extra)h+=`<h3 style="color:#3FBF6B">NOTE</h3><p style="font-size:9px">${node.extra}</p>`;

  document.getElementById('panelContent').innerHTML=h;
  document.getElementById('panel').classList.add('open');

  // Fly camera toward node
  camTarget.set(node.x,node.y,node.z);
  camDist=8;
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  if(selectedMesh)selectedMesh.material.emissiveIntensity=0.3;
  camTarget.set(0,1,0);camDist=18;
}

// ===== ANIMATE =====
let time=0;
function animate(){
  requestAnimationFrame(animate);
  time+=0.01;

  // Update camera
  if(!isDragging)camTheta+=0.001;
  camera.position.x=camTarget.x+camDist*Math.sin(camTheta)*Math.cos(camPhi);
  camera.position.y=camTarget.y+camDist*Math.sin(camPhi);
  camera.position.z=camTarget.z+camDist*Math.cos(camTheta)*Math.cos(camPhi);
  camera.lookAt(camTarget);

  // Animate nodes (gentle float)
  Object.values(meshes).forEach((m,i)=>{
    m.position.y=m.userData.y+Math.sin(time*0.5+i)*0.15;
    m.rotation.y+=0.005;
  });

  // Animate particles
  particles.forEach(p=>{
    p.userData.t+=p.userData.speed;
    if(p.userData.t>1)p.userData.t=0;
    const t=p.userData.t;
    p.position.lerpVectors(p.userData.from,p.userData.to,t);
    p.position.y+=Math.sin(t*Math.PI)*0.3;
  });

  // Point light orbit
  pt.position.x=Math.sin(time*0.3)*5;
  pt.position.z=Math.cos(time*0.3)*5;

  renderer.render(scene3,camera);

  // Stats
  const birth=new Date(1976,2,29);const death=new Date(2076,2,29);const now=new Date();
  const remain=Math.floor((death-now)/86400000);
  const pct=((now-birth)/(death-birth)*100).toFixed(2);
  document.getElementById('stats').innerHTML=`${remain.toLocaleString('it-IT')} giorni rimanenti · ${pct}% vita · 140 prodotti · 20 sub-progetti`;
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

animate();
</script>
