<!DOCTYPE html>
<html lang="it" data-lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>81+ · Plancia Spaziale, il menu dell'ecosistema</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04060f;font-family:'Sora',Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#scena{position:fixed;inset:0;cursor:grab}#scena:active{cursor:grabbing}
.hud{position:fixed;z-index:10;pointer-events:none}
.hud-top{top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;background:linear-gradient(180deg,rgba(4,6,15,.85),transparent)}
.hud-logo{font-family:'Anton','Bebas Neue';font-size:26px;letter-spacing:1px;pointer-events:auto;text-decoration:none;color:#fff}
.hud-logo span{color:#FB6B00}
.hud-hint{font-size:12px;color:#9aa6c2;text-align:right;line-height:1.6;max-width:240px}.hud-hint b{color:#FB6B00}
.titolo-centro{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;pointer-events:none;text-align:center;transition:opacity .5s}
.titolo-centro h1{font-family:'Anton','Bebas Neue';font-size:clamp(40px,9vw,90px);line-height:.9;letter-spacing:2px;background:linear-gradient(135deg,#fff,#FB6B00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:.92}
.titolo-centro p{font-family:'JetBrains Mono';font-size:13px;letter-spacing:4px;color:#5a6a8a;text-transform:uppercase;margin-top:8px}
.card-wrap{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(4,6,15,.78);backdrop-filter:blur(8px);opacity:0;transition:opacity .35s}
.card-wrap.on{display:flex;opacity:1}
.card3d{position:relative;width:min(440px,92vw);border-radius:22px;padding:2px;background:linear-gradient(135deg,#2a3550,#0c0c12 30%,#1a2438 50%,#0c0c12 70%,#2a3550);box-shadow:0 30px 80px rgba(0,0,0,.7);transform:perspective(1100px) rotateX(8deg) translateY(20px) scale(.94);transition:transform .45s cubic-bezier(.2,.9,.25,1.1);animation:cardFloat 6s ease-in-out infinite}
.card-wrap.on .card3d{transform:perspective(1100px) rotateX(0) translateY(0) scale(1)}
@keyframes cardFloat{0%,100%{margin-top:0}50%{margin-top:-10px}}
.card-inner{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(160deg,#101828,#0a0d16)}
.card-shine{position:absolute;top:0;left:-60%;width:60%;height:100%;background:linear-gradient(105deg,transparent,rgba(120,180,255,.16),transparent);transform:skewX(-18deg);animation:shine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.card-head{position:relative;height:110px;display:flex;align-items:center;justify-content:center}
.card-icon{font-size:54px;filter:drop-shadow(0 0 20px currentColor)}
.card-body{padding:6px 26px 26px;text-align:center}
.card-kick{font-family:'JetBrains Mono';font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#FB6B00;margin-bottom:8px}
.card-title{font-family:'Anton','Bebas Neue';font-size:42px;line-height:1;margin-bottom:10px;letter-spacing:1px}
.card-desc{font-size:14px;line-height:1.65;color:#b8c2d8;margin-bottom:20px}
.card-link{display:inline-block;background:linear-gradient(135deg,#E8501A,#FB6B00);color:#fff;font-weight:800;padding:13px 30px;border-radius:12px;text-decoration:none;font-size:15px;box-shadow:0 8px 24px rgba(232,80,26,.4);transition:.2s}
.card-link:hover{transform:translateY(-2px)}
.card-close{position:absolute;top:14px;right:16px;z-index:5;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#label{position:fixed;z-index:8;pointer-events:none;font-family:'Anton','Bebas Neue';font-size:16px;letter-spacing:1px;padding:6px 14px;background:rgba(8,12,22,.9);border:1px solid rgba(120,180,255,.5);border-radius:9px;display:none;transform:translate(-50%,-170%);white-space:nowrap}
#loader{position:fixed;inset:0;z-index:30;background:#04060f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#loader.hide{opacity:0;pointer-events:none}
.spinner{width:46px;height:46px;border:3px solid #16203a;border-top-color:#FB6B00;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loader p{font-size:13px;color:#5a6a8a;font-family:'JetBrains Mono';letter-spacing:1px}
.btn-torna{position:fixed;bottom:18px;left:18px;z-index:10;pointer-events:auto;background:rgba(16,24,40,.9);border:1px solid #2a3550;color:#fff;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
</style>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Sora:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
<div id="loader"><div class="spinner"></div><p>Avvio la plancia spaziale...</p></div>
<canvas id="scena"></canvas>
<div class="hud hud-top">
  <a class="hud-logo" href="index.html">81<span>+</span></a>
  <div class="hud-hint">Sei al centro della <b>plancia</b><br>Trascina per girarti, punta un <b>portale</b><br><b>Clicca</b> per aprirlo</div>
</div>
<div class="titolo-centro" id="titoloCentro"><h1>PLANCIA 81+</h1><p>Scegli la tua rotta</p></div>
<div id="label"></div>
<a class="btn-torna" href="index.html">Esci dalla plancia</a>
<div class="card-wrap" id="cardWrap">
  <div class="card3d"><div class="card-inner">
    <button class="card-close" onclick="chiudiCard()">&times;</button>
    <div class="card-shine"></div>
    <div class="card-head"><div class="card-icon" id="cardIcon">🛡️</div></div>
    <div class="card-body">
      <div class="card-kick">Destinazione</div>
      <div class="card-title" id="cardTitle">ACADEMY</div>
      <div class="card-desc" id="cardDesc">Descrizione</div>
      <a class="card-link" id="cardLink" href="#">Entra</a>
    </div>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>window.THREE||document.write('<script src="three.min.js"><\/script>')</script>
<script>
/* 81+ PLANCIA SPAZIALE. Sei al centro. I portali dei sub-progetti
   fluttuano in una sfera attorno a te. Ti giri, punti, entri.
   Una cosa che non ha nessuno: il menu come sala di comando 3D. */

const PORTALI=[
  {nome:"ACADEMY", ic:"🛡️", dom:"academy.html",                   col:0x3FBF6B, desc:"La formazione a strati. Sicurezza, HACCP, privacy. Sblocca i livelli con i PV."},
  {nome:"SHOP",    ic:"🛒", dom:"81plus.shop/",                    col:0xE8501A, desc:"Lo store. DPI, sicurezza, gadget brandizzati. Senza magazzino."},
  {nome:"STRUMENTI",ic:"🧰",dom:"strumenti.html",                  col:0x4A9FE8, desc:"Strumenti gratuiti per sicurezza, HACCP e privacy. Calcolatori e checklist."},
  {nome:"NETWORK81+", ic:"🌐", dom:"siconet.html",                    col:0xB14AE8, desc:"La rete del territorio. Networker, partner, copertura nazionale."},
  {nome:"CLUB",    ic:"💎", dom:"81plus.club/",                    col:0xFFD24A, desc:"Il club VIP. Palladium, Iridium, Rhodium. Status e community."},
  {nome:"ZONE",    ic:"🏛️", dom:"81plus.zone/",                    col:0xE84A6F, desc:"Il franchising fisico. Apri la tua sede 81+ sul territorio."},
  {nome:"EXCHANGE",ic:"⚡", dom:"81plus.exchange/",                col:0x00D9FF, desc:"Il DEX on-chain. SAF e 81X su Binance Smart Chain."},
  {nome:"WORLD",   ic:"🪐", dom:"81plus.world/",                   col:0x8A4AE8, desc:"Il metaverso 81+. Avatar, mondi, esperienze immersive."},
  {nome:"DIGITAL", ic:"🔷", dom:"81plus.digital/",                 col:0xFF6AD9, desc:"Asset digitali. NFT DIGITAL, sigilli verificabili."},
  {nome:"DASHBOARD",ic:"📊",dom:"dashboard-utente.html",           col:0x4AE8C0, desc:"La tua area riservata. PV, missioni, scadenze, tutto in un posto."},
  {nome:"AUDIT",   ic:"🎯", dom:"audit.html",                      col:0xFB6B00, desc:"L'audit gratuito. 30 normative dal tuo settore ATECO. Scopri dove sei."},
  {nome:"ACCEDI",  ic:"🔑", dom:"signup.html",                     col:0x9FE84A, desc:"Entra nell'ecosistema. Registrati e ricevi 100 PV di benvenuto."},
];

let scene,camera,renderer,raycaster,mouse;
let portaliMesh=[], portaleHover=null;
let yaw=0,pitch=0,dragging=false,lastX=0,lastY=0,autoRot=true;
let targetYaw=0,targetPitch=0;
const clock={t:0};

function init(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x04060f,0.018);
  camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.1,1000);
  camera.position.set(0,0,0.1);
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scena'),antialias:true});
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  raycaster=new THREE.Raycaster(); mouse=new THREE.Vector2(-2,-2);
  scene.add(new THREE.AmbientLight(0x6070a0,1.2));

  // nebulosa di stelle attorno
  const sg=new THREE.BufferGeometry(),sp=[],scol=[];
  for(let i=0;i<2200;i++){
    const r=60+Math.random()*200,t=Math.random()*6.28,p=Math.acos(2*Math.random()-1);
    sp.push(r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t),r*Math.cos(p));
    const m=Math.random();const c=m>0.9?[0.6,0.75,1]:m>0.78?[1,0.85,0.6]:[0.85,0.9,1];
    scol.push(...c);
  }
  sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
  sg.setAttribute('color',new THREE.Float32BufferAttribute(scol,3));
  window.__stars=new THREE.Points(sg,new THREE.PointsMaterial({size:1.3,vertexColors:true,transparent:true,opacity:.85}));
  scene.add(window.__stars);

  // anello di griglia sotto, pavimento della plancia
  const grid=new THREE.GridHelper(120,40,0x1a2a4a,0x10182a);
  grid.position.y=-18; scene.add(grid);

  // --- PORTALI disposti in cerchio/sfera attorno all'utente ---
  const N=PORTALI.length, R=22;
  PORTALI.forEach((p,i)=>{
    const ang=(i/N)*Math.PI*2;
    const ringY=(i%3-1)*7;  // tre fasce di altezza
    const x=Math.cos(ang)*R, z=Math.sin(ang)*R, y=ringY;

    const grp=new THREE.Group();
    grp.position.set(x,y,z);

    // pannello olografico, ottagono
    const shape=new THREE.CircleGeometry(3.2,8);
    const mat=new THREE.MeshBasicMaterial({color:p.col,transparent:true,opacity:.16,side:THREE.DoubleSide});
    const panel=new THREE.Mesh(shape,mat);
    grp.add(panel);
    // bordo luminoso
    const ring=new THREE.Mesh(new THREE.RingGeometry(3.1,3.5,8), new THREE.MeshBasicMaterial({color:p.col,transparent:true,opacity:.85,side:THREE.DoubleSide}));
    grp.add(ring);
    // nucleo che pulsa
    const core=new THREE.Mesh(new THREE.SphereGeometry(0.9,24,24), new THREE.MeshBasicMaterial({color:p.col}));
    grp.add(core);
    const halo=new THREE.Mesh(new THREE.SphereGeometry(1.5,20,20), new THREE.MeshBasicMaterial({color:p.col,transparent:true,opacity:.2}));
    grp.add(halo);

    grp.lookAt(0,y*0.3,0);
    grp.userData={idx:i,nome:p.nome,baseY:y,core:core,halo:halo,ring:ring,fase:i};
    scene.add(grp);
    portaliMesh.push(grp);
  });

  addEventi(); animate();
  setTimeout(()=>document.getElementById('loader').classList.add('hide'),700);
}

function addEventi(){
  const cv=renderer.domElement;
  cv.addEventListener('mousemove',e=>{
    mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
    if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;targetYaw-=dx*0.004;targetPitch-=dy*0.004;targetPitch=Math.max(-0.7,Math.min(0.7,targetPitch));lastX=e.clientX;lastY=e.clientY;autoRot=false;}
    raycastLabel(e.clientX,e.clientY);
  },{passive:true});
  cv.addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;});
  window.addEventListener('mouseup',()=>dragging=false);
  cv.addEventListener('click',e=>{
    if(Math.abs(e.clientX-lastX)>6||Math.abs(e.clientY-lastY)>6)return;
    raycaster.setFromCamera(mouse,camera);
    const hit=raycaster.intersectObjects(portaliMesh.flatMap(g=>g.children))[0];
    if(hit){let g=hit.object;while(g.parent&&g.userData.idx===undefined)g=g.parent;if(g.userData.idx!==undefined)apriCard(g.userData.idx);}
  });
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;mouse.x=(lastX/innerWidth)*2-1;mouse.y=-(lastY/innerHeight)*2+1;}},{passive:true});
  cv.addEventListener('touchmove',e=>{if(e.touches.length===1&&dragging){const t=e.touches[0],dx=t.clientX-lastX,dy=t.clientY-lastY;targetYaw-=dx*0.004;targetPitch-=dy*0.004;targetPitch=Math.max(-0.7,Math.min(0.7,targetPitch));lastX=t.clientX;lastY=t.clientY;autoRot=false;mouse.x=(t.clientX/innerWidth)*2-1;mouse.y=-(t.clientY/innerHeight)*2+1;}},{passive:true});
  cv.addEventListener('touchend',e=>{dragging=false;raycaster.setFromCamera(mouse,camera);const hit=raycaster.intersectObjects(portaliMesh.flatMap(g=>g.children))[0];if(hit){let g=hit.object;while(g.parent&&g.userData.idx===undefined)g=g.parent;if(g.userData.idx!==undefined)apriCard(g.userData.idx);}});
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}

function raycastLabel(px,py){
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects(portaliMesh.flatMap(g=>g.children))[0];
  const lab=document.getElementById('label');
  if(hit){let g=hit.object;while(g.parent&&g.userData.idx===undefined)g=g.parent;
    if(g.userData.idx!==undefined){portaleHover=g;lab.textContent=g.userData.nome;lab.style.left=px+'px';lab.style.top=py+'px';lab.style.display='block';document.body.style.cursor='pointer';return;}}
  portaleHover=null;lab.style.display='none';document.body.style.cursor='grab';
}

function animate(){
  requestAnimationFrame(animate);
  clock.t+=0.016;
  if(autoRot)targetYaw+=0.0007;
  yaw+=(targetYaw-yaw)*0.08; pitch+=(targetPitch-pitch)*0.08;
  // la camera resta al centro e ruota lo sguardo
  const lx=Math.sin(yaw)*Math.cos(pitch), ly=Math.sin(pitch), lz=Math.cos(yaw)*Math.cos(pitch);
  camera.lookAt(camera.position.x+lx,camera.position.y+ly,camera.position.z+lz);
  // portali fluttuano e pulsano
  portaliMesh.forEach(g=>{
    g.position.y=g.userData.baseY+Math.sin(clock.t*0.8+g.userData.fase)*0.8;
    const k=1+Math.sin(clock.t*2+g.userData.fase)*0.12;
    g.userData.core.scale.setScalar(k);
    g.userData.halo.scale.setScalar(1+Math.sin(clock.t*2+g.userData.fase)*0.18);
    g.userData.ring.rotation.z+=0.004;
    // evidenzia hover
    const target=(g===portaleHover)?0.4:0.16;
    g.children[0].material.opacity+=(target-g.children[0].material.opacity)*0.1;
  });
  if(window.__stars)window.__stars.rotation.y+=0.0002;
  // titolo centrale sfuma quando ti muovi
  document.getElementById('titoloCentro').style.opacity=autoRot?0.92:0.15;
  renderer.render(scene,camera);
}

function apriCard(idx){
  const p=PORTALI[idx];
  document.getElementById('cardIcon').textContent=p.ic;
  document.getElementById('cardIcon').style.color='#'+p.col.toString(16).padStart(6,'0');
  document.getElementById('cardTitle').textContent=p.nome;
  document.getElementById('cardTitle').style.color='#'+p.col.toString(16).padStart(6,'0');
  document.getElementById('cardDesc').textContent=p.desc;
  const link=document.getElementById('cardLink'); link.href=p.dom; link.textContent='Entra in '+p.nome;
  document.getElementById('cardWrap').classList.add('on');
}
function chiudiCard(){document.getElementById('cardWrap').classList.remove('on');}
document.getElementById('cardWrap').addEventListener('click',e=>{if(e.target.id==='cardWrap')chiudiCard();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')chiudiCard();});

if(window.THREE){init();}else{document.getElementById('loader').innerHTML='<p style="color:#E8501A">Errore 3D. Ricarica.</p>';}
</script>
</body>
</html>
