// ===== THREE.JS =====
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:true});
R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();S.background=new THREE.Color(0x040408);S.fog=new THREE.FogExp2(0x040408,0.008);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,200);
cam.position.set(0,12,25);cam.lookAt(0,0,-8);

S.add(new THREE.AmbientLight(0x334455,0.6));
const dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(10,20,10);S.add(dl);

// Ground grid
const gg=new THREE.GridHelper(60,60,0x0a0a18,0x060610);gg.position.y=-12;S.add(gg);

// ===== BUILD BLOCKS =====
const meshMap={};
const ray=new THREE.Raycaster();const mpos=new THREE.Vector2();

B.forEach(b=>{
  const col=new THREE.Color(b.color);
  let geo;
  if(b.type==='diamond'){
    geo=new THREE.BoxGeometry(b.w*0.7,b.h*0.7,0.3);
  } else if(b.type==='pill'){
    geo=new THREE.BoxGeometry(b.w,b.h,0.25,1,1,1);
  } else {
    geo=new THREE.BoxGeometry(b.w,b.h,0.3);
  }
  const mat=new THREE.MeshPhongMaterial({color:0x0d0d16,emissive:col,emissiveIntensity:0.15,transparent:true,opacity:0.92});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(b.x,b.y,b.z);
  if(b.type==='diamond')mesh.rotation.z=Math.PI/4;
  mesh.userData=b;
  S.add(mesh);
  meshMap[b.id]=mesh;

  // Border wireframe
  const wf=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.6}));
  wf.position.copy(mesh.position);
  if(b.type==='diamond')wf.rotation.z=Math.PI/4;
  S.add(wf);

  // Label
  const cv2=document.createElement('canvas');cv2.width=512;cv2.height=128;
  const cx=cv2.getContext('2d');
  cx.fillStyle='rgba(0,0,0,0)';cx.fillRect(0,0,512,128);
  cx.font='bold 28px system-ui';cx.fillStyle=b.color;cx.textAlign='center';
  cx.fillText(b.label,256,40);
  cx.font='16px system-ui';cx.fillStyle='#888888';
  cx.fillText(b.sub.substring(0,50),256,70);
  if(b.sub.length>50)cx.fillText(b.sub.substring(50,100),256,90);
  const tex=new THREE.CanvasTexture(cv2);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sp.position.set(b.x,b.y+b.h/2+0.6,b.z+0.2);
  sp.scale.set(b.w*1.2,b.w*0.3,1);
  S.add(sp);
});

// ===== BUILD ARROWS =====
const arrowParticles=[];
A.forEach(([fid,tid])=>{
  const fm=meshMap[fid],tm=meshMap[tid];if(!fm||!tm)return;
  const from=fm.position,to=tm.position;
  const mid=new THREE.Vector3().addVectors(from,to).multiplyScalar(0.5);
  mid.y+=0.8;

  // Curve
  const curve=new THREE.QuadraticBezierCurve3(from.clone(),mid,to.clone());
  const pts=curve.getPoints(30);
  const lg=new THREE.BufferGeometry().setFromPoints(pts);
  const fb=B.find(x=>x.id===fid);
  const col=new THREE.Color(fb?fb.color:'#333');
  const lm=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.2});
  S.add(new THREE.Line(lg,lm));

  // Arrowhead
  const tip=pts[pts.length-1];const prev=pts[pts.length-3];
  const dir3=new THREE.Vector3().subVectors(tip,prev).normalize();
  const ag=new THREE.ConeGeometry(0.12,0.4,4);
  const am=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.5});
  const arrow=new THREE.Mesh(ag,am);
  arrow.position.copy(tip);
  arrow.lookAt(tip.clone().add(dir3));
  arrow.rotateX(Math.PI/2);
  S.add(arrow);

  // Particle
  const pg=new THREE.SphereGeometry(0.06,6,6);
  const pm=new THREE.MeshBasicMaterial({color:col});
  const particle=new THREE.Mesh(pg,pm);
  particle.userData={curve,t:Math.random()};
  S.add(particle);
  arrowParticles.push(particle);
});

// ===== CAMERA CONTROLS =====
let drag=false,px=0,py=0;
let theta=0,phi=0.4,dist=28;
const target=new THREE.Vector3(2,0,-8);
let autoTour=false,tourT=0;

canvas.onmousedown=e=>{drag=true;px=e.clientX;py=e.clientY};
canvas.onmousemove=e=>{if(!drag)return;theta-=(e.clientX-px)*0.004;phi=Math.max(-0.3,Math.min(1.2,phi-(e.clientY-py)*0.004));px=e.clientX;py=e.clientY;autoTour=false};
canvas.onmouseup=()=>drag=false;
canvas.onmouseleave=()=>drag=false;
canvas.onwheel=e=>{dist=Math.max(6,Math.min(60,dist+e.deltaY*0.03));autoTour=false};
canvas.ontouchstart=e=>{if(e.touches.length===1){drag=true;px=e.touches[0].clientX;py=e.touches[0].clientY}};
canvas.ontouchmove=e=>{if(!drag||e.touches.length!==1)return;theta-=(e.touches[0].clientX-px)*0.004;phi=Math.max(-0.3,Math.min(1.2,phi-(e.touches[0].clientY-py)*0.004));px=e.touches[0].clientX;py=e.touches[0].clientY;autoTour=false};
canvas.ontouchend=()=>drag=false;

canvas.onclick=e=>{
  mpos.x=(e.clientX/innerWidth)*2-1;mpos.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mpos,cam);
  const hits=ray.intersectObjects(Object.values(meshMap));
  if(hits.length){
    const b=hits[0].object.userData;
    if(b.id)showInfo(b);
  }
};

document.onkeydown=e=>{
  const k=e.key.toLowerCase();
  if(k==='r'){theta=0;phi=0.4;dist=28;target.set(2,0,-8);autoTour=false}
  if(k===' '){autoTour=!autoTour;tourT=0;e.preventDefault()}
  if(k==='w')target.z-=1;if(k==='s')target.z+=1;
  if(k==='a')target.x-=1;if(k==='d')target.x+=1;
  if(k==='q')target.y+=1;if(k==='e')target.y-=1;
  if(k!=='r'&&k!==' ')autoTour=false;
};

// ===== INFO PANEL =====
let selMesh=null;
function showInfo(b){
  if(selMesh)selMesh.material.emissiveIntensity=0.15;
  selMesh=meshMap[b.id];
  if(selMesh)selMesh.material.emissiveIntensity=0.6;
  target.set(b.x,b.y,b.z);dist=12;

  let h=`<h2 style="color:${b.color}">${b.label}</h2><p style="color:#666">${b.sub}</p>`;
  h+=`<div class="tg" style="background:${b.color}22;color:${b.color};border:1px solid ${b.color}">${b.type.toUpperCase()}</div>`;
  if(b.detail){
    h+=`<h3 style="color:${b.color}">PERCHÉ</h3><p>${b.detail.why}</p>`;
    h+=`<h3 style="color:${b.color}">COSA</h3><p>${b.detail.what}</p>`;
    if(b.detail.products.length){
      h+=`<h3 style="color:${b.color}">PRODOTTI (${b.detail.products.length})</h3>`;
      b.detail.products.forEach(p=>{
        h+=`<div class="pr"><span class="n">${p.n}</span><span style="color:${b.color};font-weight:700">${p.p}</span></div>`;
      });
    }
  }
  document.getElementById('ic').innerHTML=h;
  document.getElementById('info').classList.add('open');
}

// Tour waypoints
const tourPts=[
  {x:0,y:12,z:25,tx:0,ty:4,tz:0},   // Overview
  {x:-2,y:6,z:8,tx:0,ty:4,tz:0},      // HUB1
  {x:-8,y:2,z:-2,tx:-6,ty:-2,tz:-8},   // HUB2 Member
  {x:-2,y:2,z:-2,tx:-2,ty:-2,tz:-8},   // Network
  {x:-4,y:-2,z:-4,tx:-2,ty:-5,tz:-10}, // Decision L6
  {x:-8,y:-4,z:-4,tx:-8,ty:-8,tz:-10}, // Franchising
  {x:12,y:6,z:0,tx:12,ty:4,tz:-4},     // Money flow
  {x:6,y:2,z:-12,tx:4,ty:-2,tz:-18},   // HUB3 Digital
  {x:10,y:0,z:-12,tx:10,ty:-2,tz:-18}, // DEX
  {x:7,y:-2,z:-14,tx:7,ty:-5,tz:-20},  // Metaverse
  {x:0,y:8,z:20,tx:2,ty:0,tz:-8},      // Back to overview
];

// ===== RENDER LOOP =====
let t=0;
function loop(){
  requestAnimationFrame(loop);t+=0.01;

  if(autoTour){
    tourT+=0.003;
    const i=Math.floor(tourT)%tourPts.length;
    const j=(i+1)%tourPts.length;
    const f=tourT%1;
    const a=tourPts[i],b=tourPts[j];
    const smooth=f*f*(3-2*f); // smoothstep
    cam.position.x=a.x+(b.x-a.x)*smooth;
    cam.position.y=a.y+(b.y-a.y)*smooth;
    cam.position.z=a.z+(b.z-a.z)*smooth;
    const lx=a.tx+(b.tx-a.tx)*smooth;
    const ly=a.ty+(b.ty-a.ty)*smooth;
    const lz=a.tz+(b.tz-a.tz)*smooth;
    cam.lookAt(lx,ly,lz);
  } else {
    cam.position.x=target.x+dist*Math.sin(theta)*Math.cos(phi);
    cam.position.y=target.y+dist*Math.sin(phi);
    cam.position.z=target.z+dist*Math.cos(theta)*Math.cos(phi);
    cam.lookAt(target);
  }

  // Animate particles
  arrowParticles.forEach(p=>{
    p.userData.t=(p.userData.t+0.004)%1;
    const pt=p.userData.curve.getPoint(p.userData.t);
    p.position.copy(pt);
  });

  // Pulse selected
  if(selMesh)selMesh.material.emissiveIntensity=0.4+Math.sin(t*3)*0.2;

  R.render(S,cam);
}

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
loop();
</script>
