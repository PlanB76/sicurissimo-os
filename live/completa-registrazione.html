<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Completa la registrazione · 81+</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--o:#E8501A;--o2:#ff7a45;--bg:#0A0A0B;--card:#141417;--line:#26262b;--w:#fff;--g:#9b9ba4;--green:#3FBF6B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--w);font-family:DM Sans,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px}
.logo{font-family:Bebas Neue;font-size:30px;display:flex;gap:10px;align-items:center}
.logo .sq{width:28px;height:28px;border-radius:7px;background:var(--o)}
h1{font-family:Bebas Neue;font-size:34px;margin:14px 0 2px}
.sub{color:var(--g);font-size:13px;margin-bottom:18px}
.verified{display:flex;align-items:center;gap:8px;background:rgba(63,191,107,.1);border:1px solid rgba(63,191,107,.4);border-radius:12px;padding:11px 14px;font-size:12px;color:var(--green);margin-bottom:16px;word-break:break-all}
label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--g);font-family:JetBrains Mono;display:block;margin:12px 0 5px}
input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--w);border-radius:10px;padding:12px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;background:var(--o);color:#1a0d00;border:0;border-radius:30px;padding:15px;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px}
.btn:hover{background:var(--o2)}
.ghost{background:transparent;color:var(--g);border:1px solid var(--line);font-weight:600}
.msg{font-size:13px;margin-top:12px;min-height:18px}
.err{color:#ff5a4d}.ok{color:var(--green)}
.avatar{display:flex;align-items:center;gap:14px;margin-top:6px}
.avatar img{width:64px;height:64px;border-radius:50%;border:2px solid var(--o);object-fit:cover;background:var(--bg)}
#rpm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.85);display:none}
#rpm iframe{width:100%;height:100%;border:0}
#rpm .x{position:absolute;top:14px;right:18px;background:var(--o);color:#1a0d00;border:0;border-radius:30px;padding:8px 16px;font-weight:700;cursor:pointer;z-index:2}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="sq"></span>81+</div>
  <h1>Completa il tuo profilo</h1>
  <div class="sub">Il tuo SIC ID è pronto. Aggiungi i tuoi dati per attivare tutto, account, wallet interni e avatar.</div>
  <div class="verified">Wallet verificato <span id="wAddr" style="opacity:.8"></span> · SIC ID <b id="sicId"></b></div>

  <label>Nome</label><input id="nome" autocomplete="given-name">
  <div class="row">
    <div><label>Cognome</label><input id="cognome" autocomplete="family-name"></div>
    <div><label>Email</label><input id="email" type="email" autocomplete="email"></div>
  </div>
  <label>Password, almeno 8 caratteri</label><input id="password" type="password" autocomplete="new-password">

  <label>Avatar</label>
  <div class="avatar">
    <img id="avPrev" src="https://api.dicebear.com/9.x/identicon/svg?seed=81plus" alt="">
    <button class="btn ghost" style="width:auto;margin:0;padding:11px 18px" onclick="openRPM()">Crea il tuo avatar 3D</button>
  </div>
  <input type="hidden" id="avatar">

  <button class="btn" onclick="salva()">Attiva il mio account</button>
  <div class="msg" id="msg"></div>
</div>

<div id="rpm"><button class="x" onclick="closeRPM()">Chiudi</button><iframe id="rpmFrame" allow="camera *; microphone *"></iframe></div>

<script>
var API="/core81/api/completa_profilo.php";
async function me(){
  try{var r=await fetch(API+"?action=me",{credentials:"include"});var d=await r.json();
    if(!d.ok){location.href="/login.html";return;}
    document.getElementById("sicId").textContent=d.sic_id;
    document.getElementById("wAddr").textContent=d.wallet?("· "+d.wallet.slice(0,6)+"…"+d.wallet.slice(-4)):"";
    if(d.nome)document.getElementById("nome").value=d.nome;
    if(d.cognome)document.getElementById("cognome").value=d.cognome;
    if(d.email)document.getElementById("email").value=d.email;
    if(d.avatar){document.getElementById("avatar").value=d.avatar;document.getElementById("avPrev").src=d.avatar.replace(".glb",".png");}
  }catch(e){location.href="/login.html";}
}
function openRPM(){var f=document.getElementById("rpmFrame");f.src="https://demo.readyplayer.me/avatar?frameApi";document.getElementById("rpm").style.display="block";}
function closeRPM(){document.getElementById("rpm").style.display="none";document.getElementById("rpmFrame").src="";}
window.addEventListener("message",function(e){
  var d=e.data;
  if(typeof d==="string"&&d.endsWith(".glb")){
    document.getElementById("avatar").value=d;
    document.getElementById("avPrev").src=d.replace(".glb",".png");
    closeRPM();
  } else if(d&&d.eventName==="v1.avatar.exported"&&d.data&&d.data.url){
    document.getElementById("avatar").value=d.data.url;
    document.getElementById("avPrev").src=d.data.url.replace(".glb",".png");
    closeRPM();
  }
});
async function salva(){
  var msg=document.getElementById("msg");msg.textContent="";msg.className="msg";
  var body={nome:nome.value.trim(),cognome:cognome.value.trim(),email:email.value.trim(),password:password.value,avatar:document.getElementById("avatar").value};
  try{var r=await fetch(API+"?action=save",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify(body)});
    var d=await r.json();
    if(d.ok){msg.className="msg ok";msg.textContent="Account attivato. Ti porto nella tua area.";setTimeout(function(){location.href=d.redirect||"/dashboard.html";},900);}
    else{msg.className="msg err";msg.textContent=d.error||"Errore. Riprova.";}
  }catch(e){msg.className="msg err";msg.textContent="Connessione assente. Riprova.";}
}
me();
</script>
</body>
</html>
